<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Collect Effect Test - Additive Blend Mode</title>
    <script src="./assets/libs/pixi.min.js"></script>
    <script src="./assets/libs/spine-pixi.js"></script>
  </head>
  <body style="margin:0;background:#000000;overflow:hidden;">
    <div
      id="controls"
      style="position:absolute;top:20px;left:20px;z-index:1000;display:flex;flex-direction:column;gap:15px;"
    >
      <div style="color:white;font-size:14px;font-weight:600;margin-bottom:5px;">
        Collect Effect Test:
      </div>
      <button
        id="playHit"
        style="padding:10px 20px;background:#00ff00;color:#000000;border:none;border-radius:5px;cursor:pointer;font-size:14px;font-weight:600;"
      >
        Play Hit
      </button>
      <button
        id="toggleLoop"
        style="padding:10px 20px;background:#ff00ff;color:white;border:none;border-radius:5px;cursor:pointer;font-size:14px;font-weight:600;"
      >
        Loop (OFF)
      </button>
    </div>
    <script>
      (async () => {
        const app = new PIXI.Application();
        await app.init({
          width: window.innerWidth,
          height: window.innerHeight,
          backgroundColor: 0x000000, // Черный фон для лучшей видимости аддитивного эффекта
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
        });
        document.body.appendChild(app.canvas);
        app.stage.sortableChildren = true;
        app.stage.eventMode = "static";
        app.stage.hitArea = app.screen;

        // Загрузка фона для видимости аддитивных эффектов
        const bgTexture = await PIXI.Assets.load("./slots/slot_2/bg_png/1920х1080.png");
        const bgSprite = new PIXI.Sprite(bgTexture);
        bgSprite.x = app.screen.width / 2;
        bgSprite.y = app.screen.height / 2;
        bgSprite.anchor.set(0.5);
        bgSprite.zIndex = 0;
        app.stage.addChild(bgSprite);

        // Загрузка ресурсов из пиньят
        await PIXI.Assets.load([
          { alias: "collectEffectSkeleton", src: "./assets/pinatas/skeleton.json" },
          { alias: "collectEffectAtlas", src: "./assets/pinatas/skeleton.atlas" },
        ]);

        // Создание отдельных экземпляров Spine для каждой анимации
        const createSpineInstance = (animName) => {
          const instance = spine.Spine.from({
            skeleton: "collectEffectSkeleton",
            atlas: "collectEffectAtlas",
            scale: 1,
          });

          // Устанавливаем физику
          if (!instance.skeleton.physics) {
            instance.skeleton.physics = {
              update: () => {},
              updateGlobal: () => {},
            };
          }

          // Позиционируем в центре экрана
          instance.x = app.screen.width / 2;
          instance.y = app.screen.height / 2;
          instance.zIndex = 10;
          
          // Добавляем на stage
          app.stage.addChild(instance);

          // Ждем один кадр
          return new Promise((resolve) => {
            requestAnimationFrame(async () => {
              // Устанавливаем скин "blue"
              const blueSkin = instance.skeleton.data.findSkin("blue");
              if (blueSkin) {
                instance.skeleton.setSkin(blueSkin);
                instance.skeleton.setSlotsToSetupPose();
                if (instance.skeleton.physics && instance.skeleton.physics.update) {
                  instance.skeleton.updateWorldTransform(instance.skeleton.physics.update);
                }
              }
              resolve(instance);
            });
          });
        };

        // Создаем все экземпляры
        const spineHit = await createSpineInstance("hit");
        const spineEndEffect = await createSpineInstance("end_effect");
        const spineRoundStart = await createSpineInstance("round-effect-start");
        const spineRoundEnd = await createSpineInstance("round-effect-end");

        let isLooping = false;

        // Функция для запуска анимаций
        const playHit = (loop = false) => {
          // Сбрасываем все экземпляры в setup pose
          [spineHit, spineEndEffect, spineRoundStart, spineRoundEnd].forEach(spine => {
            spine.skeleton.setSlotsToSetupPose();
            spine.skeleton.setBonesToSetupPose();
            if (spine.skeleton.physics && spine.skeleton.physics.update) {
              spine.skeleton.updateWorldTransform(spine.skeleton.physics.update);
            }
          });
          
          // Запускаем анимации на каждом экземпляре отдельно
          const entry1 = spineHit.state.setAnimation(0, "hit", loop);
          const entry2 = spineEndEffect.state.setAnimation(0, "end_effect", loop);
          const entry3 = spineRoundStart.state.setAnimation(0, "round-effect-start", loop);
          const entry4 = spineRoundEnd.state.setAnimation(0, "round-effect-end", loop);
          
          if (entry1 && entry2 && entry3 && entry4) {
            console.log(`✅ Анимации запущены на отдельных экземплярах (loop: ${loop})`);
          } else {
            console.warn("⚠️ Не удалось запустить все анимации");
          }
        };

        // Настройка кнопок
        document.getElementById("playHit").onclick = () => {
          playHit(false);
        };

        document.getElementById("toggleLoop").onclick = () => {
          isLooping = !isLooping;
          const btn = document.getElementById("toggleLoop");
          btn.textContent = `Loop (${isLooping ? "ON" : "OFF"})`;
          btn.style.background = isLooping ? "#ff00ff" : "#aa00aa";
          
          if (isLooping) {
            playHit(true);
          } else {
            // Останавливаем все анимации
            spineHit.state.clearTrack(0);
            spineEndEffect.state.clearTrack(0);
            spineRoundStart.state.clearTrack(0);
            spineRoundEnd.state.clearTrack(0);
            
            // Устанавливаем null на всех экземплярах
            spineHit.state.setAnimation(0, "null", true);
            spineEndEffect.state.setAnimation(0, "null", true);
            spineRoundStart.state.setAnimation(0, "null", true);
            spineRoundEnd.state.setAnimation(0, "null", true);
            
            // Восстанавливаем состояние слотов
            [spineHit, spineEndEffect, spineRoundStart, spineRoundEnd].forEach(spine => {
              spine.skeleton.setSlotsToSetupPose();
              if (spine.skeleton.physics && spine.skeleton.physics.update) {
                spine.skeleton.updateWorldTransform(spine.skeleton.physics.update);
              }
            });
          }
        };

        // Обновление в ticker
        app.ticker.add(() => {
          // Обновляем все экземпляры
          [spineHit, spineEndEffect, spineRoundStart, spineRoundEnd].forEach(spine => {
            if (spine && spine.skeleton && spine.skeleton.physics) {
              spine.skeleton.updateWorldTransform(spine.skeleton.physics.update);
            }
          });
        });

        // Обработчик изменения размера окна
        window.addEventListener("resize", () => {
          setTimeout(() => {
            [spineHit, spineEndEffect, spineRoundStart, spineRoundEnd].forEach(spine => {
              spine.x = app.screen.width / 2;
              spine.y = app.screen.height / 2;
            });
            bgSprite.x = app.screen.width / 2;
            bgSprite.y = app.screen.height / 2;
          }, 100);
        });

        // Запускаем анимацию один раз после инициализации, чтобы она проигралась до конца
        // и остановилась на последнем кадре (как в рабочей версии)
        playHit(false);

        console.log("✅ Collect Effect Test инициализирован");
        console.log("   Используется Spine из: ./assets/pinatas/skeleton.json");
        console.log("   Скин: blue");
        console.log("   Анимации: hit, end_effect");
      })()
        .catch((err) => {
          console.error(err);
          document.body.innerHTML =
            '<div style="color:#fff;font-family:monospace;padding:24px;">Ошибка: ' +
            err.message +
            "</div>";
        });
    </script>
  </body>
</html>
