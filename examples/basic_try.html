<html>
  <head>
    <meta charset="UTF-8" />
    <title>spine-pixi</title>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@latest/dist/pixi.min.js"></script>
    <script src="../dist/spine-pixi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.9/dist/tweakpane.min.js"></script>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <script>
      (async function () {
        var app = new PIXI.Application();
        await app.init({
          width: window.innerWidth,
          height: window.innerHeight,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
          resizeTo: window,
          backgroundColor: 0x2c3e50,
          hello: true,
        });
        document.body.appendChild(app.view);
        // Предзагрузка данных скелетов и атласа
        PIXI.Assets.add({ alias: "frameData", src: "./assets/frame.json" });
        PIXI.Assets.add({ alias: "clawData", src: "./assets/claw.json" });
        PIXI.Assets.add({ alias: "symData", src: "./assets/symbols.json" });
        PIXI.Assets.add({ alias: "wfData", src: "./assets/winframe.json" });
        PIXI.Assets.add({
          alias: "welcomeAtlas",
          src: "./assets/welcome_scr.atlas",
        });
        // Загрузка ресурсов
        await PIXI.Assets.load(["wfData", "welcomeAtlas"]);
        await PIXI.Assets.load(["frameData", "welcomeAtlas"]);
        await PIXI.Assets.load(["clawData", "welcomeAtlas"]);
        await PIXI.Assets.load(["symData", "welcomeAtlas"]);
        function setAnimationSequence(target, animations, startDelay = 0) {
          setTimeout(() => {
            animations.forEach(({ name, loop, delay }, index) => {
              if (index === 0) {
                target.state.setAnimation(0, name, loop); // Первая анимация
              } else {
                target.state.addAnimation(0, name, loop, delay);
              }
            });
          }, startDelay * 1000); // Задержка начала всей последовательности
        }
        function setPosition(target, xXoffcet, yXoffcet, scale = 1) {
          const cwPos = window.innerWidth / 2;
          const chPos = window.innerHeight / 2;
          target.x = cwPos - xXoffcet * scale;
          target.y = chPos - yXoffcet * scale;
        }
        //переменные
        const tOffset_01 = 2; //офсеты по времени для боксов
        const tOffset_02 = 6;
        const tOffset_03 = 0;
        const boxScale = 1;
        const cwPos = window.innerWidth / 2;
        const chPos = window.innerHeight / 2;
        const frame_01 = spine.Spine.from({
          skeleton: "frameData",
          atlas: "welcomeAtlas",
          scale: boxScale,
        });
        const frame_02 = spine.Spine.from({
          skeleton: "frameData",
          atlas: "welcomeAtlas",
          scale: boxScale,
        });
        const wframes = Array.from({ length: 3 }, () =>
          spine.Spine.from({
            skeleton: "wfData",
            atlas: "welcomeAtlas",
            scale: boxScale,
          })
        );
        const [wframe_01, wframe_02, wframe_03] = wframes;
        const claws = Array.from({ length: 6 }, () =>
          spine.Spine.from({
            skeleton: "clawData",
            atlas: "welcomeAtlas",
            scale: boxScale,
          })
        );
        const [claw_01, claw_02, claw_03, claw_04, claw_05, claw_06] = claws;
        const sym = Array.from({ length: 8 }, () =>
          spine.Spine.from({
            skeleton: "symData",
            atlas: "welcomeAtlas",
            scale: boxScale,
          })
        );
        const [
          sym_01,
          sym_02,
          sym_03,
          sym_04,
          sym_05,
          sym_06,
          puff_02,
          puff_03,
        ] = sym;

        const initBox1 = async () => {
          // Позиционирование объектов
          setPosition(wframe_01, 0, 0, boxScale);
          setPosition(frame_01, 0, 0, boxScale);
          setPosition(claw_01, 94, 27.3, boxScale);
          setPosition(claw_02, 2, 27.3, boxScale);
          setPosition(claw_03, -91, 27.3, boxScale);
          setPosition(sym_01, 90, -47.7, boxScale);
          setPosition(sym_02, 0, -47.7, boxScale);
          setPosition(sym_03, -90, -47.7, boxScale);
          setPosition(puff_02, 0, -47.7, boxScale);
          setPosition(puff_03, -90, -47.7, boxScale);
          // Установка анимаций для claw_01
          setAnimationSequence(claw_01, [
            { name: "lock_static", loop: false, delay: 0 },
            { name: "unlock", loop: false, delay: 2 + tOffset_01 },
            { name: "claw_idle", loop: true, delay: 0 },
          ]);
          setAnimationSequence(claw_02, [
            { name: "lock_static", loop: false, delay: 0 },
            { name: "unlock", loop: false, delay: 2.2 + tOffset_01 },
            { name: "claw_idle", loop: true, delay: 0 },
          ]);
          setAnimationSequence(claw_03, [
            { name: "lock_static", loop: false, delay: 0 },
            { name: "unlock", loop: false, delay: 3.8 },
            { name: "claw_idle", loop: true, delay: 0 },
          ]);
          setAnimationSequence(sym_01, [
            { name: "low_purple_idle", loop: false, delay: 0 },
            { name: "spin", loop: true, delay: 1 },
            { name: "low_purple_idle", loop: false, delay: 0.5 },
          ]);
          setAnimationSequence(sym_02, [
            { name: "high_pink_idle", loop: false, delay: 0 },
            { name: "spin", loop: true, delay: 1.2 },
            { name: "high_blue_booster_idle", loop: false, delay: 0.5 },
            { name: "spin", loop: true, delay: 1 },
            { name: "high_pink_idle", loop: false, delay: 0.5 },
          ]);
          setAnimationSequence(sym_03, [
            { name: "low_pink_idle", loop: false, delay: 0 },
            { name: "spin", loop: true, delay: 1.4 },
            { name: "low_blue_booster_idle", loop: false, delay: 0.5 },
            { name: "spin", loop: true, delay: 1 },
            { name: "high_orange_booster_idle", loop: false, delay: 0.5 },
            { name: "spin", loop: true, delay: 1 },
            { name: "low_pink_idle", loop: false, delay: 0.5 },
          ]);
          setAnimationSequence(
            puff_02,
            [{ name: "disappearance", loop: false, delay: 0 }],
            2.6
          );
          setAnimationSequence(
            puff_03,
            [
              { name: "disappearance", loop: false, delay: 0 },
              { name: "disappearance", loop: false, delay: 1.4 },
            ],
            2.8
          );
          // Установка анимаций для frame_01
          setAnimationSequence(frame_01, [
            { name: "frame_start", loop: false, delay: 0 },
            { name: "bar_1", loop: false, delay: 2.6 },
            { name: "bar_2", loop: false, delay: 0 },
            { name: "bar_2_idle", loop: true, delay: 0 },
            { name: "bar_3", loop: false, delay: 2 },
            { name: "bar_3_idle", loop: true, delay: 0 },
          ]);
          // Установка анимаций для wframe_01
          setAnimationSequence(wframe_01, [
            { name: "idle", loop: true, delay: 0 },
          ]);
          // Установка времени смешивания анимаций для "claw_01"
          claw_01.state.data.defaultMix = 0.2;
          claw_02.state.data.defaultMix = 0.2;
          claw_03.state.data.defaultMix = 0.2;
          sym_01.state.data.defaultMix = 0.2;
          sym_02.state.data.defaultMix = 0.2;
          sym_03.state.data.defaultMix = 0.2;
          frame_01.state.data.defaultMix = 0.2;
          // Добавление объектов на сцену в контейнере для трансформаций
          const container1 = new PIXI.Container();
          container1.addChild(frame_01);
          //container1.addChild(claw_01);
          //container1.addChild(claw_02);
          container1.addChild(claw_03);
          container1.addChild(sym_01);
          container1.addChild(sym_02);
          container1.addChild(sym_03);
          container1.addChild(puff_02);
          container1.addChild(puff_03);
          container1.addChild(wframe_01);
          app.stage.addChild(container1); //контейнер
          return container1;
        };
        const initBox2 = async () => {
          // Позиционирование объектов
          setPosition(wframe_02, 0, 0, boxScale);
          setPosition(frame_02, 0, 0, boxScale);
          setPosition(claw_04, 94, 27.3, boxScale);
          setPosition(claw_05, 2, 27.3, boxScale);
          setPosition(claw_06, -91, 27.3, boxScale);
          setPosition(sym_04, 90, -47.7, boxScale);
          setPosition(sym_05, 0, -47.7, boxScale);
          setPosition(sym_06, -90, -47.7, boxScale);
          setPosition(puff_02, 0, -47.7, boxScale);
          setPosition(puff_03, -90, -47.7, boxScale);
          // Установка анимаций для claw_04
          setAnimationSequence(claw_04, [
            { name: "claw_idle", loop: true, delay: 0 },
            { name: "claw_down", loop: false, delay: 1 + tOffset_02 },
            { name: "claw_bomb_10", loop: false, delay: 0 },
            { name: "claw_idle", loop: true, delay: 0 },
            { name: "claw_down", loop: false, delay: 1 },
            { name: "claw_bomb_15", loop: false, delay: 0 },
            { name: "claw_idle", loop: true, delay: 0 },
          ]);
          setAnimationSequence(claw_05, [
            { name: "claw_idle", loop: true, delay: 0 },
            { name: "claw_down", loop: false, delay: 1.2 + tOffset_02 },
            { name: "claw_bomb_10", loop: false, delay: 0 },
            { name: "claw_idle", loop: true, delay: 0 },
            { name: "claw_down", loop: false, delay: 1 },
            { name: "claw_bomb_15", loop: false, delay: 0 },
            { name: "claw_idle", loop: true, delay: 0 },
          ]);
          setAnimationSequence(claw_06, [
            { name: "claw_idle", loop: true, delay: 0 },
            { name: "claw_down", loop: false, delay: 1.4 + tOffset_02 },
            { name: "claw_bomb_10", loop: false, delay: 0 },
            { name: "claw_idle", loop: true, delay: 0 },
            { name: "claw_down", loop: false, delay: 1 },
            { name: "claw_bomb_15", loop: false, delay: 0 },
            { name: "claw_idle", loop: true, delay: 0 },
          ]);
          setAnimationSequence(sym_04, [
            { name: "low_purple_idle", loop: false, delay: 0 },
            { name: "spin", loop: true, delay: 1 + tOffset_02 },
            { name: "low_purple_idle", loop: false, delay: 0.5 },
          ]);
          setAnimationSequence(sym_05, [
            { name: "high_pink_idle", loop: false, delay: 0 },
            { name: "spin", loop: true, delay: 1.2 + tOffset_02 },
            { name: "high_blue_booster_idle", loop: false, delay: 0.5 },
            { name: "spin", loop: true, delay: 1 },
            { name: "high_pink_idle", loop: false, delay: 0.5 },
          ]);
          setAnimationSequence(sym_06, [
            { name: "low_pink_idle", loop: false, delay: 0 },
            { name: "spin", loop: true, delay: 1.4 + tOffset_02 },
            { name: "low_blue_booster_idle", loop: false, delay: 0.5 },
            { name: "spin", loop: true, delay: 1 },
            { name: "high_orange_booster_idle", loop: false, delay: 0.5 },
            { name: "spin", loop: true, delay: 1 },
            { name: "low_pink_idle", loop: false, delay: 0.5 },
          ]);
          // Установка анимаций для frame_02
          setAnimationSequence(frame_02, [
            { name: "frame_start", loop: false, delay: 0 },
          ]);
          // Установка анимаций для wframe_02
          setAnimationSequence(wframe_02, [
            { name: "idle", loop: true, delay: 0 },
          ]);
          // Установка времени смешивания анимаций для "claw_04"
          claw_04.state.data.defaultMix = 0.2;
          claw_05.state.data.defaultMix = 0.2;
          claw_06.state.data.defaultMix = 0.2;
          sym_04.state.data.defaultMix = 0.2;
          sym_05.state.data.defaultMix = 0.2;
          sym_06.state.data.defaultMix = 0.2;
          frame_02.state.data.defaultMix = 0.2;
          // Добавление объектов на сцену в контейнере для трансформаций
          const container2 = new PIXI.Container();
          container2.addChild(frame_02);
          container2.addChild(claw_04);
          container2.addChild(claw_05);
          container2.addChild(claw_06);
          container2.addChild(sym_04);
          container2.addChild(sym_05);
          container2.addChild(sym_06);
          container2.addChild(wframe_02);
          app.stage.addChild(container2); //контейнер
          return container2;
        };
        const cbox1 = await initBox1();
        cbox1.x = 0;
        cbox1.y = -100;
        const cbox2 = await initBox2();
        cbox2.x = 0;
        cbox2.y = 220;
      })();
    </script>
  </body>
</html>
