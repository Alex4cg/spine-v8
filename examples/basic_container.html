<html>
  <head>
    <meta charset="UTF-8" />
    <title>spine-pixi</title>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@latest/dist/pixi.min.js"></script>
    <script src="../dist/spine-pixi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.9/dist/tweakpane.min.js"></script>
    <link rel="stylesheet" href="./index.css">
  </head>

  <body>
    <script>
      (async function () {
        var app = new PIXI.Application();
        await app.init({
          width: window.innerWidth,
          height: window.innerHeight,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
          resizeTo: window,
          backgroundColor: 0x2c3e50,
          hello: true,
        })
        document.body.appendChild(app.view);

        // Pre-load the skeleton data and atlas. You can also load .json skeleton data.
        PIXI.Assets.add({alias: "spineboyData", src: "./assets/spineboy-pro.skel"});
        PIXI.Assets.add({alias: "spineboyAtlas", src: "./assets/spineboy-pma.atlas"});
        await PIXI.Assets.load(["spineboyData", "spineboyAtlas"]);
        document.body.appendChild(app.view);
					// Предзагрузка данных скелетов и атласа
					PIXI.Assets.add({ alias: 'frameData', src: './assets/frame.json' });
					PIXI.Assets.add({ alias: 'clawData', src: './assets/claw.json' });
					PIXI.Assets.add({ alias: 'symData', src: './assets/symbols.json' });
					PIXI.Assets.add({ alias: 'wfData', src: './assets/winframe.json' });
					PIXI.Assets.add({
						alias: 'welcomeAtlas',
						src: './assets/welcome_scr.atlas',
					});
					// Загрузка ресурсов
					await PIXI.Assets.load(['wfData', 'welcomeAtlas']);
					await PIXI.Assets.load(['frameData', 'welcomeAtlas']);
					await PIXI.Assets.load(['clawData', 'welcomeAtlas']);
					await PIXI.Assets.load(['symData', 'welcomeAtlas']);

        // Create the spine display object
        const spineboy = spine.Spine.from({skeleton: "spineboyData", atlas: "spineboyAtlas", 
          scale: 1,
        });

        // Set the default mix time to use when transitioning
        // from one animation to the next.
        spineboy.state.data.defaultMix = 0.2;

        // Center the spine object on screen.
        spineboy.x = window.innerWidth / 2;
        spineboy.y = window.innerHeight / 2 + spineboy.getBounds().height / 2;
        

        // Set animation "run" on track 0, looped.
        const container = new PIXI.Container();
        spineboy.state.setAnimation(0, "run", true);

        // Add the display object to the stage.
        container.addChild(spineboy);
        app.stage.addChild(spineboy);
        return container; // Возвращаем контейнер для управления
        
      })();
    </script>
  </body>
</html>
