<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cascade Slot Test - Slot 5</title>
  
  <script src="../../assets/libs/pixi.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #game-container {
      position: relative;
      width: 722px;
      height: 1283px;
      background: #2a2a2a;
      border: 2px solid #444;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    
    #spin-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    #spin-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    #spin-button:active {
      transform: translateX(-50%) scale(0.95);
    }
    
    #spin-button:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.6;
      pointer-events: none; /* Полностью отключаем взаимодействие */
    }
    
    #spin-button:disabled:hover {
      transform: translateX(-50%) !important;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4) !important;
    }
    
    #spin-button:disabled:active {
      transform: translateX(-50%) !important;
    }
    
    /* Анимация для активной кнопки */
    #spin-button:not(:disabled):hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    #spin-button:not(:disabled):active {
      transform: translateX(-50%) scale(0.95);
    }
    
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      z-index: 1000;
    }
    
    #controls-toggle-button {
      position: fixed;
      top: 50px;
      left: calc(50vw + 361px + 20px);
      z-index: 10001;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 12px;
      transition: all 0.3s ease;
    }
    
    #controls-toggle-button:hover {
      background: rgba(0,0,0,0.9);
      border-color: rgba(255,255,255,0.5);
    }
    
    #controls {
      position: fixed;
      top: 50px;
      left: calc(50vw + 361px + 20px);
      z-index: 10000;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 12px;
      display: none;
      margin-top: 35px;
    }
    
    /* Overlay для блокировки всех взаимодействий во время спина */
    #spin-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 10000;
      pointer-events: none; /* По умолчанию не блокирует */
      display: none;
    }
    
    #spin-overlay.active {
      display: block;
      pointer-events: all; /* Блокирует все взаимодействия */
      cursor: not-allowed;
    }
    
    /* Панель режима */
    #mode-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10002;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      min-width: 200px;
    }
    
    #mode-panel h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #fff;
    }
    
    .mode-option {
      margin: 8px 0;
      display: flex;
      align-items: center;
    }
    
    .mode-option input[type="radio"] {
      margin-right: 8px;
      cursor: pointer;
    }
    
    .mode-option label {
      cursor: pointer;
      user-select: none;
    }
    
    /* UI генератора */
    #generator-ui {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.2);
      display: none;
    }
    
    #generator-ui.active {
      display: block;
    }
    
    #generator-ui input[type="number"] {
      width: 100%;
      padding: 6px;
      margin: 8px 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      color: white;
      font-size: 12px;
    }
    
    #generator-ui input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    #generator-ui button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    
    #generator-ui button:hover {
      opacity: 0.9;
    }
    
    #generator-ui button:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    #scenario-output {
      width: 100%;
      height: 200px;
      margin: 8px 0;
      padding: 6px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      resize: vertical;
      overflow: auto;
      line-height: 1.2;
      white-space: pre;
    }
    
    #visualization-controls {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    
    #visualization-controls label {
      display: block;
      margin: 5px 0;
      font-size: 11px;
    }
    
    #speed-slider {
      width: 100%;
      margin: 5px 0;
    }
    
    #visualization-progress {
      margin: 8px 0;
      font-size: 11px;
      color: #aaa;
    }
    
    #visualization-controls button {
      width: 48%;
      margin: 2px 1%;
      padding: 6px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="info">Каскадное насыпание символов</div>
    <div id="step-info" style="position: absolute; top: 50px; left: 20px; color: white; font-size: 14px; z-index: 1000; display: none;"></div>
    <button id="spin-button">SPIN</button>
    <div id="spin-overlay"></div>
  </div>
  
  <!-- Панель режима -->
  <div id="mode-panel">
    <h3>Режим работы</h3>
    <div class="mode-option">
      <input type="radio" id="mode-game" name="mode" value="game" checked>
      <label for="mode-game">Игра (с анимацией)</label>
    </div>
    <div class="mode-option">
      <input type="radio" id="mode-generator" name="mode" value="generator">
      <label for="mode-generator">Генератор сценариев</label>
    </div>
    
    <!-- UI генератора -->
    <div id="generator-ui">
      <label for="spin-count-input">Количество спинов:</label>
      <input type="number" id="spin-count-input" min="1" max="100" value="10">
      <button id="generate-button">Генерировать сценарий</button>
      
      <!-- Управление визуализацией -->
      <div id="visualization-controls">
        <label for="speed-slider">Скорость (мс между шагами):</label>
        <input type="range" id="speed-slider" min="0" max="1000" value="300" step="50">
        <div id="visualization-progress"></div>
        <button id="pause-button" disabled>Пауза</button>
        <button id="stop-button" disabled>Стоп</button>
      </div>
      
      <textarea id="scenario-output" readonly placeholder="Сценарий появится здесь..."></textarea>
      <button id="download-button" disabled>Скачать JSON</button>
    </div>
  </div>

  <script type="module">
    // Убеждаемся, что PIXI загружен
    if (typeof PIXI === 'undefined') {
      console.error('❌ PIXI не загружен!');
    }

    import { CascadeManager } from './CascadeManager.js';
    import { ScenarioGenerator } from './ScenarioGenerator.js';
    import { ScenarioVisualizer } from './ScenarioVisualizer.js';
    import { CONFIG, loadDelays } from './config.js';
    import { GridCalculator } from './GridCalculator.js';
    import { AssetLoader } from './AssetLoader.js';
    import { GridRenderer } from './GridRenderer.js';
    import { UIController } from './UIController.js';
    import { createDebugMenu } from './DebugMenu.js';

    // Объявляем grid, scenarioGenerator и visualizer в области видимости модуля
    let grid = null;
    let scenarioGenerator = null;
    let scenarioVisualizer = null;
    let currentMode = 'game'; // 'game' или 'generator'

    (async () => {
      const app = new PIXI.Application();
      await app.init({
        width: CONFIG.APP_WIDTH,
        height: CONFIG.APP_HEIGHT,
        backgroundColor: 0x1a1a1a,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });
      
      document.getElementById('game-container').appendChild(app.canvas);
      app.stage.sortableChildren = true;

      // Загрузка и добавление фоновой текстуры
      const bgTexture = await PIXI.Assets.load('./png/bg_scale.png');
      const bgSprite = new PIXI.Sprite(bgTexture);
      bgSprite.width = CONFIG.APP_WIDTH;
      bgSprite.height = CONFIG.APP_HEIGHT;
      bgSprite.x = 0;
      bgSprite.y = 0;
      bgSprite.zIndex = 0; // Самый нижний слой
      app.stage.addChild(bgSprite);
      console.log('✅ Фоновая текстура загружена и добавлена');
      
      // Загрузка и добавление gid.png
      const gidTexture = await PIXI.Assets.load('./png/gid.png');
      const gidSprite = new PIXI.Sprite(gidTexture);
      gidSprite.x = CONFIG.APP_WIDTH / 2;
      gidSprite.y = CONFIG.APP_HEIGHT / 2;
      gidSprite.anchor.set(0.5);
      gidSprite.zIndex = 10;
      app.stage.addChild(gidSprite);
      console.log('✅ Gid текстура загружена и добавлена');

      // Загрузка и добавление field_regular.png
      const fieldRegularTexture = await PIXI.Assets.load('./png/field_regular.png');
      const fieldRegularSprite = new PIXI.Sprite(fieldRegularTexture);
      fieldRegularSprite.x = 0;
      fieldRegularSprite.y = 0;
      fieldRegularSprite.zIndex = 25;
      app.stage.addChild(fieldRegularSprite);
      console.log('✅ Field Regular текстура загружена и добавлена');
      
      // Инициализация раскрывающегося меню настроек (создаем элементы меню ДО initDelayInputs)
      // gameFieldContainer будет добавлен позже
      const debugMenu = createDebugMenu(app, {
        bgSprite: bgSprite,
        gidSprite: gidSprite,
        fieldRegularSprite: fieldRegularSprite
      }, {
        width: CONFIG.APP_WIDTH,
        height: CONFIG.APP_HEIGHT
      });
      
      // Конфигурация сетки символов из CONFIG
      const GRID_COLS = CONFIG.GRID.COLS;
      const GRID_ROWS = CONFIG.GRID.ROWS;
      const SYMBOL_SIZE = CONFIG.GRID.SYMBOL_SIZE;
      const SYMBOL_TEXTURE_SIZE = CONFIG.GRID.SYMBOL_TEXTURE_SIZE;
      const GRID_START_X = GridCalculator.getGridStartX(CONFIG.APP_WIDTH, GRID_COLS, SYMBOL_SIZE);
      const GRID_START_Y = CONFIG.GRID.START_Y;
      
      // Инициализация UI контроллера для задержек (после создания элементов меню)
      const delays = UIController.initDelayInputs({
        onRowDelayChange: (value) => {
          if (grid) grid.ROW_DELAY = value;
        },
        onColumnDelayChange: (value) => {
          if (grid) grid.COLUMN_DELAY = value;
        },
        onNewMatrixDelayChange: (value) => {
          if (grid) grid.NEW_MATRIX_DELAY = value;
        },
        onOldRowDelayChange: (value) => {
          if (grid) grid.OLD_ROW_DELAY = value;
        },
        onOldColumnDelayChange: (value) => {
          if (grid) grid.OLD_COLUMN_DELAY = value;
        },
        onFallSpeedChange: (value) => {
          if (grid) grid.setFallSpeed(value);
        }
      });
      
      // Используем значения из UIController
      const ROW_DELAY = delays.rowDelay;
      const COLUMN_DELAY = delays.columnDelay;
      const NEW_MATRIX_DELAY = delays.newMatrixDelay;
      const OLD_ROW_DELAY = delays.oldRowDelay;
      const OLD_COLUMN_DELAY = delays.oldColumnDelay;
      const FALL_SPEED = delays.fallSpeed;

      // Статическая матрица позиций (центры ячеек) - используем GridCalculator
      const gridPositions = GridCalculator.calculatePositions(
        GRID_COLS,
        GRID_ROWS,
        SYMBOL_SIZE,
        GRID_START_X,
        GRID_START_Y
      );
      
      console.log('✅ Статическая сетка позиций создана:', gridPositions);

      // Загрузка текстур символов - используем AssetLoader
      const symbolTextures = await AssetLoader.loadSymbolTextures(
        CONFIG.ASSETS.SYMBOL_TEXTURE_FILES,
        CONFIG.ASSETS.SYMBOL_TEXTURES_PATH
      );

      console.log(`✅ Загружено ${symbolTextures.length} текстур символов`);

      // Загрузка конфигурации выплат
      const payoutsConfig = await AssetLoader.loadPayouts(CONFIG.ASSETS.PAYOUTS_PATH);
      console.log('✅ Конфигурация выплат загружена');

      // Создаем родительский контейнер для игрового поля (поле, разметка, маска и символы — всё вместе)
      const gameFieldContainer = new PIXI.Container();
      gameFieldContainer.x = 0;
      gameFieldContainer.y = 0;
      gameFieldContainer.zIndex = 50;
      app.stage.addChild(gameFieldContainer);

      // Создаем визуальные элементы сетки внутри контейнера поля (фон поля + разметка)
      const gridVisuals = GridRenderer.renderGrid(gameFieldContainer, {
        startX: GRID_START_X,
        startY: GRID_START_Y,
        cols: GRID_COLS,
        rows: GRID_ROWS,
        symbolSize: SYMBOL_SIZE
      }, gridPositions, gameFieldContainer, GRID_START_X);
      gridVisuals.gameFieldBg.visible = false; // тёмный квадрат поля скрыт
      
      // Создаем контейнер для символов
      const symbolContainer = new PIXI.Container();
      symbolContainer.zIndex = 100;
      gameFieldContainer.addChild(symbolContainer);

      // Создаем прямоугольную маску для игрового поля
      const gameFieldMask = new PIXI.Graphics();
      const gameFieldWidth = GRID_COLS * SYMBOL_SIZE;
      const gameFieldHeight = GRID_ROWS * SYMBOL_SIZE;
      gameFieldMask.rect(0, 0, gameFieldWidth, gameFieldHeight);
      gameFieldMask.fill(0xFFFFFF); // Белый цвет для маски
      gameFieldMask.x = GRID_START_X;
      gameFieldMask.y = GRID_START_Y;
      gameFieldMask.zIndex = 50; // Маска должна быть ниже символов, но выше фона
      
      // Добавляем маску в контейнер игрового поля
      gameFieldContainer.addChild(gameFieldMask);
      
      // Применяем маску к контейнеру символов
      symbolContainer.mask = gameFieldMask;
      
      console.log('✅ Прямоугольная маска применена к контейнеру символов');
      console.log(`📐 Размеры маски: ${gameFieldWidth}x${gameFieldHeight} (${GRID_COLS} колонок × ${GRID_ROWS} строк × ${SYMBOL_SIZE}px)`);
      console.log(`📍 Позиция маски: x=${GRID_START_X}, y=${GRID_START_Y}`);
      
      // Добавляем gameFieldContainer в дебаг-меню
      if (debugMenu && debugMenu.addElement) {
        debugMenu.addElement('gameField', 'Game Field', gameFieldContainer, {
          x: 0,
          y: 0,
          scale: 1,
          zIndex: 50
        });
      }
      if (debugMenu && debugMenu.setDebugOverlay) {
        debugMenu.setDebugOverlay([
          gridVisuals.gameFrame,
          gridVisuals.gridMarkers,
          gridVisuals.indexContainer
        ]);
      }

      // Создаем каскадный менеджер
      grid = new CascadeManager({
        container: symbolContainer,
        symbolTextures: symbolTextures,
        gridPositions: gridPositions,
        gridCols: GRID_COLS,
        gridRows: GRID_ROWS,
        symbolSize: SYMBOL_SIZE,
        symbolTextureSize: SYMBOL_TEXTURE_SIZE,
        fallSpeed: FALL_SPEED,
        rowDelay: ROW_DELAY,
        columnDelay: COLUMN_DELAY,
        newMatrixDelay: NEW_MATRIX_DELAY,
        oldRowDelay: OLD_ROW_DELAY,
        oldColumnDelay: OLD_COLUMN_DELAY,
        gridStartY: GRID_START_Y,
        payoutsConfig: payoutsConfig,
        minSymbolsForWin: payoutsConfig.winRules.minSymbols
      });
      
      // Первый экран — предопределённая раскладка без выигрыша; спин — рандом
      grid.fillInitialNoWin();

      if (debugMenu && debugMenu.setSymbolDebugOverlay) {
        debugMenu.setSymbolDebugOverlay((visible) => grid.setSymbolDebugOverlayVisible(visible));
      }

      console.log('✅ Визуальные элементы сетки созданы через GridRenderer');
      
      // Инициализация кнопки спин через UIController
      const spinButton = document.getElementById('spin-button');
      UIController.initSpinButton(spinButton, grid);

      // Устанавливаем callback для загрузки сценариев из DebugMenu
      window.loadScenarioCallback = (scenarioData) => {
        if (grid && scenarioData) {
          const loaded = grid.loadScenario(scenarioData);
          if (loaded) {
            // loadScenario уже устанавливает правильный начальный шаг (первый спин)
            // Обновляем информацию в DebugMenu
            if (debugMenu && debugMenu.updateScenarioInfo) {
              const step = grid.getCurrentScenarioStep();
              const stepNum = grid.currentScenarioStep + 1;
              const stepInfo = step ? `Step ${stepNum}/${scenarioData.length}: ${step.event.toUpperCase()}` : `Loaded: ${scenarioData.length} steps`;
              debugMenu.updateScenarioInfo(stepInfo);
            }
            console.log(`✅ Сценарий загружен в игру: ${scenarioData.length} шагов, текущий шаг: ${grid.currentScenarioStep + 1}`);
          }
        }
      };

      // Инициализация генератора сценариев
      scenarioGenerator = new ScenarioGenerator({
        gridCols: GRID_COLS,
        gridRows: GRID_ROWS,
        minSymbolsForWin: payoutsConfig.winRules.minSymbols,
        symbolCount: symbolTextures.length,
        payoutsConfig: payoutsConfig,
        symbolNames: CONFIG.ASSETS.SYMBOL_TEXTURE_FILES.map(name => name.replace('.png', ''))
      });

      // Инициализация переключателя режима
      const modeGameRadio = document.getElementById('mode-game');
      const modeGeneratorRadio = document.getElementById('mode-generator');
      const generatorUI = document.getElementById('generator-ui');
      const spinCountInput = document.getElementById('spin-count-input');
      const generateButton = document.getElementById('generate-button');
      const scenarioOutput = document.getElementById('scenario-output');
      const downloadButton = document.getElementById('download-button');
      const speedSlider = document.getElementById('speed-slider');
      const pauseButton = document.getElementById('pause-button');
      const stopButton = document.getElementById('stop-button');
      const visualizationProgress = document.getElementById('visualization-progress');
      const stepInfo = document.getElementById('step-info');

      // Функция переключения режима
      function switchMode(mode) {
        currentMode = mode;
        
        if (mode === 'game') {
          // Режим игры: показываем кнопку SPIN, скрываем UI генератора
          spinButton.style.display = 'block';
          generatorUI.classList.remove('active');
          stepInfo.style.display = 'none';
          // Очищаем визуализатор если был создан
          if (scenarioVisualizer) {
            scenarioVisualizer.clear();
          }
          // Включаем обновление анимации
          app.ticker.start();
        } else {
          // Режим генератора: скрываем кнопку SPIN, показываем UI генератора
          spinButton.style.display = 'none';
          generatorUI.classList.add('active');
          stepInfo.style.display = 'block';
          stepInfo.textContent = 'Готов к генерации';
          
          // Создаем визуализатор если еще не создан
          if (!scenarioVisualizer) {
            scenarioVisualizer = new ScenarioVisualizer({
              container: symbolContainer,
              symbolTextures: symbolTextures,
              gridPositions: gridPositions,
              gridCols: GRID_COLS,
              gridRows: GRID_ROWS,
              symbolSize: SYMBOL_SIZE,
              symbolTextureSize: SYMBOL_TEXTURE_SIZE,
              stepDelay: parseInt(speedSlider.value)
            });
          }
        }
      }

      // Обработчики переключения режима
      modeGameRadio.addEventListener('change', () => {
        if (modeGameRadio.checked) switchMode('game');
      });
      
      modeGeneratorRadio.addEventListener('change', () => {
        if (modeGeneratorRadio.checked) switchMode('generator');
      });

      // Обработчик генерации сценария с визуализацией
      generateButton.addEventListener('click', async () => {
        const spinCount = parseInt(spinCountInput.value) || 10;
        
        if (spinCount < 1 || spinCount > 100) {
          alert('Количество спинов должно быть от 1 до 100');
          return;
        }

        // Блокируем UI
        generateButton.disabled = true;
        generateButton.textContent = 'Генерация...';
        pauseButton.disabled = false;
        stopButton.disabled = false;
        scenarioOutput.value = 'Генерация сценария...';
        visualizationProgress.textContent = '';
        
        // Сбрасываем визуализатор
        if (scenarioVisualizer) {
          scenarioVisualizer.reset();
          scenarioVisualizer.setStepDelay(parseInt(speedSlider.value));
        }
        
        try {
          // Генерируем сценарий используя generateSpinWithCascades
          const scenario = [];
          
          for (let spinIndex = 0; spinIndex < spinCount; spinIndex++) {
            if (scenarioVisualizer && scenarioVisualizer.isStopped) {
              break;
            }
            
            // Генерируем один спин с каскадами через generateSpinWithCascades
            const steps = scenarioGenerator.generateSpinWithCascades(
              () => scenarioGenerator.generateRandomGrid(),
              (cascadeStepIndex, refillIndex) => Math.floor(Math.random() * symbolTextures.length)
            );
            
            // Визуализируем каждый шаг
            for (const step of steps) {
              if (scenarioVisualizer && scenarioVisualizer.isStopped) {
                break;
              }
              
              if (scenarioVisualizer) {
                stepInfo.style.display = 'block';
                const winningPositions = scenarioGenerator.findWinningPositions(step.grid);
                if (winningPositions.size > 0) {
                  stepInfo.textContent = `${step.event === 'spin' ? '🔄 СПИН' : '⚡ КАСКАД'} ${spinIndex + 1}/${spinCount} (${winningPositions.size} выигрышных, выплата: ${step.totalPayout})`;
                  await scenarioVisualizer.showStep(step.grid, step.event, winningPositions);
                  await new Promise(resolve => setTimeout(resolve, 500));
                } else {
                  stepInfo.textContent = `${step.event === 'spin' ? '🔄 СПИН' : '⚡ КАСКАД'} ${spinIndex + 1}/${spinCount} (без выигрыша)`;
                  await scenarioVisualizer.showStep(step.grid, step.event);
                }
                visualizationProgress.textContent = `Спин ${spinIndex + 1}/${spinCount}, шаг ${scenario.length + 1}`;
              }
            }
            
            scenario.push(...steps);
          }
          
          // Сохраняем сценарий
          scenarioGenerator.scenario = scenario;
          
          // Обновляем вывод в выбранном формате
          updateScenarioOutput();
          
          downloadButton.disabled = false;
          visualizationProgress.textContent = `✅ Готово: ${scenario.length} шагов (${spinCount} спинов)`;
          stepInfo.textContent = `✅ Готово: ${scenario.length} шагов`;
          
          console.log(`✅ Сгенерирован сценарий: ${scenario.length} шагов (${spinCount} спинов)`);
        } catch (error) {
          console.error('Ошибка генерации сценария:', error);
          scenarioOutput.value = `Ошибка: ${error.message}`;
          visualizationProgress.textContent = `❌ Ошибка: ${error.message}`;
        } finally {
          generateButton.disabled = false;
          generateButton.textContent = 'Генерировать сценарий';
          pauseButton.disabled = true;
          stopButton.disabled = true;
        }
      });
      
      // Обработчик слайдера скорости
      speedSlider.addEventListener('input', (e) => {
        const delay = parseInt(e.target.value);
        if (scenarioVisualizer) {
          scenarioVisualizer.setStepDelay(delay);
        }
      });
      
      // Обработчик паузы
      pauseButton.addEventListener('click', () => {
        if (scenarioVisualizer) {
          const isPaused = scenarioVisualizer.togglePause();
          pauseButton.textContent = isPaused ? 'Продолжить' : 'Пауза';
        }
      });
      
      // Обработчик стоп
      stopButton.addEventListener('click', () => {
        if (scenarioVisualizer) {
          scenarioVisualizer.stop();
          pauseButton.textContent = 'Пауза';
          pauseButton.disabled = true;
          stopButton.disabled = true;
          generateButton.disabled = false;
          generateButton.textContent = 'Генерировать сценарий';
        }
      });

      // Функция обновления вывода сценария (только JSON формат)
      function updateScenarioOutput() {
        if (!scenarioGenerator || !scenarioGenerator.scenario || scenarioGenerator.scenario.length === 0) {
          return;
        }
        
        scenarioOutput.value = scenarioGenerator.exportToJSON();
      }
      
      // Обработчик скачивания сценария
      downloadButton.addEventListener('click', () => {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
        const filename = `${timestamp}`;
        scenarioGenerator.downloadScenario(filename);
      });

      // Обновление в ticker
      app.ticker.add(() => {
        if (currentMode === 'game' && grid) {
          const deltaTime = app.ticker.deltaMS / 1000;
          grid.update(deltaTime);
          
          // Обновляем информацию о текущем шаге сценария в DebugMenu
          if (grid.scenarioMode && grid.currentScenario && debugMenu && debugMenu.updateScenarioInfo) {
            const step = grid.getCurrentScenarioStep();
            if (step) {
              const stepNum = grid.currentScenarioStep + 1;
              const totalSteps = grid.currentScenario.length;
              const eventType = step.event === 'spin' ? 'SPIN' : 'CASCADE';
              const payout = step.totalPayout || 0;
              debugMenu.updateScenarioInfo(`Step ${stepNum}/${totalSteps}: ${eventType}${payout > 0 ? ` (Payout: ${payout})` : ''}`);
            }
          }
        }
      });

      console.log('✅ Каскадная слот-игра инициализирована');
    })().catch((err) => {
      console.error('Ошибка инициализации:', err);
      document.body.innerHTML = 
        '<div style="color:#fff;font-family:monospace;padding:24px;">Ошибка: ' + err.message + '</div>';
    });
  </script>
</body>
</html>
