<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page - Slot 5</title>
  
  <script src="../../assets/libs/pixi.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 20px;
      width: 100vw;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    #test-container {
      position: relative;
      width: 800px;
      min-height: 600px;
      background: #2a2a2a;
      border: 3px solid #444;
      border-radius: 15px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      padding: 20px;
      margin-bottom: 20px;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }
    
    #info-panel {
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 8px;
      color: white;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    #test-button {
      padding: 15px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      margin: 10px;
    }
    
    #test-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    #test-button:active {
      transform: scale(0.95);
    }
    
    #canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-top: 20px;
    }
    
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      font-weight: bold;
    }
    
    .status.success {
      background: rgba(0, 255, 0, 0.2);
      color: #0f0;
      border: 1px solid #0f0;
    }
    
    .status.error {
      background: rgba(255, 0, 0, 0.2);
      color: #f00;
      border: 1px solid #f00;
    }
    
    .status.info {
      background: rgba(0, 150, 255, 0.2);
      color: #09f;
      border: 1px solid #09f;
    }
  </style>
</head>
<body>
  <div id="test-container">
    <h1>🧪 Тестовая страница Slot 5</h1>
    
    <div id="info-panel">
      <div class="status info">ℹ️ Тестовая страница для проверки компонентов</div>
      <div id="status-messages"></div>
    </div>
    
    <div style="text-align: center;">
      <button id="test-button">Запустить тест</button>
    </div>
    
    <div id="canvas-container"></div>
  </div>

  <script type="module">
    // Проверка загрузки PIXI
    function addStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status-messages');
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusDiv.appendChild(div);
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    // Проверка PIXI
    if (typeof PIXI === 'undefined') {
      addStatus('❌ PIXI не загружен!', 'error');
    } else {
      addStatus('✅ PIXI загружен успешно', 'success');
      addStatus(`📦 Версия PIXI: ${PIXI.VERSION || 'неизвестна'}`, 'info');
    }

    // Импорт модулей
    let modulesLoaded = false;
    try {
      const { CONFIG } = await import('./config.js');
      addStatus('✅ config.js загружен', 'success');
      
      const { GridCalculator } = await import('./GridCalculator.js');
      addStatus('✅ GridCalculator загружен', 'success');
      
      const { GridRenderer } = await import('./GridRenderer.js');
      addStatus('✅ GridRenderer загружен', 'success');
      
      modulesLoaded = true;
      addStatus('✅ Все модули загружены успешно', 'success');
    } catch (err) {
      addStatus(`❌ Ошибка загрузки модулей: ${err.message}`, 'error');
      console.error('Ошибка загрузки:', err);
    }

    // Обработчик кнопки теста
    document.getElementById('test-button').addEventListener('click', async () => {
      if (!modulesLoaded) {
        addStatus('❌ Модули не загружены. Перезагрузите страницу.', 'error');
        return;
      }

      try {
        const { CONFIG } = await import('./config.js');
        const { GridCalculator } = await import('./GridCalculator.js');
        const { GridRenderer } = await import('./GridRenderer.js');

        addStatus('🚀 Запуск теста...', 'info');

        // Создание PIXI приложения
        const app = new PIXI.Application();
        await app.init({
          width: 700,
          height: 500,
          backgroundColor: 0x1a1a1a,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
        });
        
        const canvasContainer = document.getElementById('canvas-container');
        canvasContainer.innerHTML = '';
        canvasContainer.appendChild(app.canvas);
        app.stage.sortableChildren = true;

        addStatus('✅ PIXI Application создан', 'success');

        // Тест GridCalculator
        const GRID_COLS = CONFIG.GRID.COLS;
        const GRID_ROWS = CONFIG.GRID.ROWS;
        const SYMBOL_SIZE = CONFIG.GRID.SYMBOL_SIZE;
        const GRID_START_X = GridCalculator.getGridStartX(700, GRID_COLS, SYMBOL_SIZE);
        const GRID_START_Y = 50;

        const gridPositions = GridCalculator.calculatePositions(
          GRID_COLS,
          GRID_ROWS,
          SYMBOL_SIZE,
          GRID_START_X,
          GRID_START_Y
        );

        addStatus(`✅ Сетка позиций создана: ${GRID_COLS}x${GRID_ROWS}`, 'success');

        // Тест GridRenderer
        const gridVisuals = GridRenderer.renderGrid(app.stage, {
          startX: GRID_START_X,
          startY: GRID_START_Y,
          cols: GRID_COLS,
          rows: GRID_ROWS,
          symbolSize: SYMBOL_SIZE
        }, gridPositions);

        addStatus('✅ Визуальные элементы сетки созданы', 'success');
        addStatus(`📐 Позиция сетки: x=${GRID_START_X}, y=${GRID_START_Y}`, 'info');
        addStatus(`📏 Размер символа: ${SYMBOL_SIZE}px`, 'info');

        addStatus('✅ Тест завершен успешно!', 'success');
      } catch (err) {
        addStatus(`❌ Ошибка выполнения теста: ${err.message}`, 'error');
        console.error('Ошибка теста:', err);
      }
    });
  </script>
</body>
</html>
