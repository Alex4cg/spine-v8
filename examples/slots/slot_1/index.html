<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Prototype - Slot 1</title>
  
  <!-- Подключаем шрифты Montserrat Extra Bold и Aclonica из Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
      overflow: hidden; /* Предотвращаем скролл */
      position: relative;
    }
    
    #game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      background: #2a2a2a;
      border: 2px solid #444;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      transform-origin: center center; /* Центр масштабирования */
    }
    
    /* Экран загрузки */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.5s ease-out;
    }
    
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    #loading-screen img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    /* Скрываем canvas до загрузки */
    #game-container canvas {
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }
    
    #game-container canvas.visible {
      opacity: 1;
    }
    
    #ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 100;
    }
    
    #spin-button {
      display: none; /* Скрываем HTML кнопку, используем PIXI кнопку */
    }
    
    #spin-counter {
      color: white;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 4px;
    }
    
    #mode-selector {
      display: flex;
      gap: 10px;
    }
    
    .mode-button {
      padding: 8px 16px;
      font-size: 14px;
      background: #555;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .mode-button.active {
      background: #4CAF50;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Экран загрузки -->
    <div id="loading-screen">
      <img src="./ui/loading_scr.png" alt="Loading...">
    </div>
    
    <div id="ui">
      <div id="mode-selector">
        <button class="mode-button active" data-mode="classic">Classic</button>
        <button class="mode-button" data-mode="holdnwin">Hold n Win</button>
      </div>
      <button id="spin-button">SPIN</button>
      <div id="spin-counter">Spins: 0 / 30</div>
    </div>
  </div>

  <!-- Используем локальные библиотеки, как в train-test.html -->
  <script src="../../assets/libs/pixi.min.js"></script>
  <script src="../../assets/libs/spine-pixi.js"></script>
  <script src="../../assets/libs/particle-emitter.min.js"></script>
  
  <script type="module">
    import { SLOT_CONFIG } from './config.js';
    import { SlotMachine } from './SlotMachine.js';
    import { SpinButton } from './SpinButton.js';
    
    (async function() {
      const config = { ...SLOT_CONFIG };
      
      // Получаем элементы для управления загрузкой
      const loadingScreen = document.getElementById('loading-screen');
      const container = document.getElementById('game-container');
      
      // Создаем PixiJS приложение (настройки как в train-test.html)
      const app = new PIXI.Application();
      await app.init({
        width: config.resolution.width,
        height: config.resolution.height,
        backgroundColor: 0x1a1a1a,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
        antialias: true,
      });
      
      container.appendChild(app.canvas);
      
      // Функция для масштабирования контейнера под размер окна
      const updateScale = () => {
        const gameWidth = config.resolution.width;
        const gameHeight = config.resolution.height;
        
        // Получаем реальные размеры viewport
        // Используем document.documentElement для более точного определения на мобильных
        const windowWidth = Math.min(window.innerWidth, document.documentElement.clientWidth);
        const windowHeight = Math.min(window.innerHeight, document.documentElement.clientHeight);
        
        // Вычисляем масштаб, чтобы игра помещалась в окно
        const scaleX = windowWidth / gameWidth;
        const scaleY = windowHeight / gameHeight;
        let scale = Math.min(scaleX, scaleY); // Используем меньший масштаб для сохранения пропорций
        
        // На мобильных устройствах может быть проблема с devicePixelRatio
        // Ограничиваем масштаб разумными пределами
        scale = Math.max(0.1, Math.min(scale, 1.5));
        
        // Устанавливаем размеры контейнера
        container.style.width = `${gameWidth}px`;
        container.style.height = `${gameHeight}px`;
        
        // Применяем масштаб с центрированием
        // translate(-50%, -50%) центрирует элемент относительно его центра
        container.style.transform = `translate(-50%, -50%) scale(${scale})`;
      };
      
      // Применяем масштаб при загрузке и изменении размера окна
      updateScale();
      window.addEventListener('resize', updateScale);
      
      // Обработка поворота экрана на мобильных устройствах
      window.addEventListener('orientationchange', () => {
        // Задержка для корректного определения размера после поворота
        setTimeout(updateScale, 150);
      });
      
      // Включаем сортировку по zIndex
      app.stage.sortableChildren = true;
      
      // Применяем глобальное замедление для отладки
      if (config.debug && config.debug.timeScale !== undefined) {
        const timeScale = config.debug.timeScale;
        app.ticker.speed = timeScale;
        console.log(`Global timeScale applied: ${timeScale}x (${timeScale < 1 ? 'slower' : 'faster'})`);
      }
      
      // Создаем слот-машину
      const slotMachine = new SlotMachine(config, app);
      await slotMachine.init(); // Инициализация с загрузкой текстур
      
      // UI элементы
      const spinCounter = document.getElementById('spin-counter');
      const modeButtons = document.querySelectorAll('.mode-button');
      
      // Создаем графическую кнопку спин
      const spinButton = new SpinButton(config, app, async () => {
        if (slotMachine.isSpinning) return;
        
        spinButton.setDisabled(true);
        await slotMachine.spin();
      });
      
      // Сохраняем ссылку на кнопку в slotMachine для доступа из дебаггера
      slotMachine.spinButton = spinButton;
      
      // Обновляем список элементов в дебаггере после создания кнопки
      if (slotMachine.debugEditor && slotMachine.debugEditor.updateElementList) {
        slotMachine.debugEditor.updateElementList();
      }
      
      // Обновление счетчика
      const updateCounter = () => {
        spinCounter.textContent = `Spins: ${slotMachine.spinCount} / ${config.maxSpins}`;
        if (slotMachine.spinCount >= config.maxSpins) {
          spinButton.setDisabled(true);
        }
      };
      
      // Обработчик спина
      slotMachine.onSpinComplete = () => {
        spinButton.setDisabled(false);
        updateCounter();
      };
      
      // Переключение режимов
      modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const mode = btn.dataset.mode;
          slotMachine.setGameMode(mode);
          
          modeButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
      
      updateCounter();
      
      // Ждем завершения всех асинхронных операций (включая setTimeout в init)
      // SlotMachine.init() использует setTimeout(200ms) для позиционирования элементов
      await new Promise(resolve => setTimeout(resolve, 300));
      
      // Показываем игру и скрываем экран загрузки
      const canvas = container.querySelector('canvas');
      if (canvas) {
        canvas.classList.add('visible');
      }
      
      // Скрываем экран загрузки с задержкой для плавного перехода
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        // Удаляем экран загрузки из DOM после анимации
        setTimeout(() => {
          loadingScreen.remove();
        }, 500);
      }, 100);
      
      console.log('Slot Machine initialized:', config);
    })();
  </script>
</body>
</html>
