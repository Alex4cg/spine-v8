<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot 6 Prototype - Test</title>
  
  <script src="../../assets/libs/pixi.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #2a2a2a;
      border: 2px solid #444;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    
    #controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      background: #1a1a2e;
      border: 2px solid #444;
      border-radius: 8px;
      min-width: 300px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .control-group label {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }
    
    .control-group input {
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 120px;
    }
    
    button:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    button:active:not(:disabled) {
      transform: scale(0.95);
    }
    
    button:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    #info {
      color: #fff;
      font-size: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }
    
    #info h3 {
      margin-bottom: 5px;
      color: #667eea;
    }
    
    #info p {
      margin: 3px 0;
    }
    
    #file-input {
      display: none;
    }
    
    .file-label {
      display: inline-block;
      padding: 10px 20px;
      background: #444;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.3s ease;
    }
    
    .file-label:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="main-wrapper">
    <div id="game-container"></div>
    
    <div id="controls">
      <div class="control-group">
        <label>Количество спинов:</label>
        <input type="number" id="spin-count" value="10" min="1" max="100">
      </div>
      
      <div class="control-group">
        <label>Задержка между шагами (мс):</label>
        <input type="number" id="step-delay" value="500" min="0" max="5000" step="100">
      </div>
      
      <div class="button-group">
        <button id="generate-btn">Generate Scenario</button>
        <button id="play-btn" disabled>Play Scenario</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="stop-btn" disabled>Stop</button>
      </div>
      
      <div class="button-group">
        <button id="save-btn" disabled>Save Scenario</button>
        <label for="file-input" class="file-label">Load Scenario</label>
        <input type="file" id="file-input" accept=".json">
      </div>
      
      <div id="info">
        <h3>Info</h3>
        <p id="step-info">Step: - / -</p>
        <p id="spin-info">Spin: -</p>
        <p id="win-info">Total Win: 0</p>
        <p id="multipliers-info">Multipliers: -</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { ScenarioGenerator } from './ScenarioGenerator.js';
    import { GameVisualizer } from './GameVisualizer.js';
    import { CONFIG } from './config.js';
    import { createDebugMenu } from './DebugMenu.js';

    (async () => {
      // Инициализация PixiJS
      const app = new PIXI.Application();
      await app.init({
        width: 800,
        height: 600,
        backgroundColor: CONFIG.COLORS.BACKGROUND,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
      });

      const gameContainer = document.getElementById('game-container');
      gameContainer.appendChild(app.canvas);

      // Создаем контейнер для визуализации
      const visualizerContainer = new PIXI.Container();
      app.stage.addChild(visualizerContainer);
      app.stage.sortableChildren = true;

      // Инициализация генератора и визуализатора
      const generator = new ScenarioGenerator();
      const visualizer = new GameVisualizer({
        container: visualizerContainer,
        app: app
      });

      // Инициализация дебаг меню
      const debugMenu = createDebugMenu(app, {}, {
        width: 800,
        height: 600
      });

      // Добавляем элементы в дебаг меню
      // Контейнер стека ожидающих символов (4x3 сетка)
      debugMenu.addElement('stackContainer', 'Поле ожидающих символов (стек)', visualizer.stackContainer, {
        x: CONFIG.POSITIONS.STACK_START_X,
        y: CONFIG.POSITIONS.STACK_START_Y,
        scale: 1,
        zIndex: 10
      });

      // Контейнер игрового поля (3 символа в ряд)
      debugMenu.addElement('fieldContainer', 'Основное игровое поле', visualizer.fieldContainer, {
        x: CONFIG.POSITIONS.FIELD_START_X,
        y: CONFIG.POSITIONS.FIELD_Y,
        scale: 1,
        zIndex: 20
      });

      // Загружаем сохраненные позиции после добавления всех элементов
      debugMenu.reloadAllSettings();

      // Состояние приложения
      let currentScenario = null;
      let isPlaying = false;

      // Элементы UI
      const generateBtn = document.getElementById('generate-btn');
      const playBtn = document.getElementById('play-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const stopBtn = document.getElementById('stop-btn');
      const saveBtn = document.getElementById('save-btn');
      const spinCountInput = document.getElementById('spin-count');
      const stepDelayInput = document.getElementById('step-delay');
      const fileInput = document.getElementById('file-input');
      
      // Инициализация состояния кнопки сохранения
      saveBtn.disabled = true;
      
      const stepInfo = document.getElementById('step-info');
      const spinInfo = document.getElementById('spin-info');
      const winInfo = document.getElementById('win-info');
      const multipliersInfo = document.getElementById('multipliers-info');

      // Обновление информации
      function updateInfo(step, totalSteps) {
        if (step) {
          stepInfo.textContent = `Step: ${step.stepIndex + 1} / ${totalSteps}`;
          spinInfo.textContent = `Spin: ${step.spinIndex + 1}`;
          
          if (step.event === 'result') {
            winInfo.textContent = `Total Win: ${step.totalWin || 0}`;
            if (step.accumulatedMultipliers && step.accumulatedMultipliers.length > 0) {
              multipliersInfo.textContent = `Multipliers: ${step.accumulatedMultipliers.map(m => `x${m}`).join(', ')}`;
            } else {
              multipliersInfo.textContent = 'Multipliers: -';
            }
          }
        }
      }

      // Генерация сценария
      generateBtn.addEventListener('click', () => {
        const spinCount = parseInt(spinCountInput.value) || 10;
        
        generateBtn.disabled = true;
        generateBtn.textContent = 'Generating...';
        
        setTimeout(() => {
          currentScenario = generator.generateScenario(spinCount);
          const stats = generator.getStatistics();
          
          console.log('Scenario generated:', stats);
          console.log('Total steps:', currentScenario.length);
          
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Scenario';
        playBtn.disabled = false;
        saveBtn.disabled = false;
        
        // Сохраняем сценарий в консоль для отладки
        console.log('Scenario:', currentScenario);
      }, 100);
    });

      // Сохранение сценария
      saveBtn.addEventListener('click', () => {
        if (!currentScenario || currentScenario.length === 0) {
          alert('Please generate or load a scenario first!');
          return;
        }
        
        generator.saveToFile('scenario.json');
      });

      // Воспроизведение сценария
      playBtn.addEventListener('click', async () => {
        if (!currentScenario || currentScenario.length === 0) {
          alert('Please generate or load a scenario first!');
          return;
        }
        
        isPlaying = true;
        generateBtn.disabled = true;
        playBtn.disabled = true;
        pauseBtn.disabled = false;
        stopBtn.disabled = false;
        
        const delay = parseInt(stepDelayInput.value) || 500;
        visualizer.setStepDelay(delay);
        
        await visualizer.visualizeScenario(currentScenario, (stepIndex, step, totalSteps) => {
          updateInfo(step, totalSteps);
        });
        
        isPlaying = false;
        generateBtn.disabled = false;
        playBtn.disabled = false;
        pauseBtn.disabled = true;
        stopBtn.disabled = true;
      });

      // Пауза
      pauseBtn.addEventListener('click', () => {
        const isPaused = visualizer.togglePause();
        pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
      });

      // Остановка
      stopBtn.addEventListener('click', () => {
        visualizer.stop();
        isPlaying = false;
        generateBtn.disabled = false;
        playBtn.disabled = false;
        pauseBtn.disabled = true;
        stopBtn.disabled = true;
        pauseBtn.textContent = 'Pause';
        saveBtn.disabled = currentScenario && currentScenario.length > 0 ? false : true;
      });

      // Изменение задержки
      stepDelayInput.addEventListener('change', () => {
        const delay = parseInt(stepDelayInput.value) || 500;
        visualizer.setStepDelay(delay);
      });

      // Загрузка сценария из файла
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const jsonData = JSON.parse(event.target.result);
            generator.loadScenario(jsonData);
            currentScenario = generator.scenario;
            
          console.log('Scenario loaded:', currentScenario.length, 'steps');
          playBtn.disabled = false;
          saveBtn.disabled = false;
          
          alert(`Scenario loaded: ${currentScenario.length} steps`);
          } catch (error) {
            console.error('Error loading scenario:', error);
            alert('Error loading scenario: ' + error.message);
          }
        };
        reader.readAsText(file);
      });

      // Добавляем элементы в дебаг меню (пользователь может добавить свои через debugMenu.addElement)
      // Пример: debugMenu.addElement('visualizerContainer', 'Visualizer Container', visualizerContainer, { x: 0, y: 0, scale: 1, zIndex: 0 });

      // Инициализация
      console.log('Slot 6 Prototype initialized');
      console.log('Config:', CONFIG);
      console.log('Debug menu available:', debugMenu);
    })();
  </script>
</body>
</html>
