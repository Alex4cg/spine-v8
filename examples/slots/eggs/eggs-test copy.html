<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Eggs Test Stand - Spine Animation Control</title>
    <script src="../../assets/libs/pixi.min.js"></script>
    <script src="../../assets/libs/spine-pixi.js"></script>
    <script src="./DebugPositionEditor.js"></script>
  </head>
  <body style="margin:0;background:#1a1a1a;overflow:hidden;">
    <div
      id="controls"
      style="position:absolute;top:20px;left:20px;z-index:1000;display:flex;flex-direction:column;gap:15px;max-height:90vh;overflow-y:auto;padding-right:10px;"
    >
      <div style="color:white;font-size:16px;font-weight:600;margin-bottom:10px;">
        Eggs Test Stand
      </div>
      
      <div style="color:white;font-size:14px;font-weight:600;margin-bottom:5px;">
        Скины:
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <button
          id="skin_00_gold"
          style="padding:6px 12px;background:#ffd700;color:#1a1a1a;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;"
        >
          00 Gold
        </button>
        <button
          id="skin_01_blue"
          style="padding:6px 12px;background:#4a90e2;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;"
        >
          01 Blue
        </button>
        <button
          id="skin_02_red"
          style="padding:6px 12px;background:#4a90e2;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;"
        >
          02 Red
        </button>
        <button
          id="skin_03_purple"
          style="padding:6px 12px;background:#4a90e2;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;"
        >
          03 Purple
        </button>
        <button
          id="skin_04_mini"
          style="padding:6px 12px;background:#ffe100;color:#1a1a1a;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;"
        >
          04 Mini
        </button>
        <button
          id="skin_05_midi"
          style="padding:6px 12px;background:#ffe100;color:#1a1a1a;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;"
        >
          05 Midi
        </button>
        <button
          id="skin_06_major"
          style="padding:6px 12px;background:#ffe100;color:#1a1a1a;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;"
        >
          06 Major
        </button>
        <button
          id="skin_07_grand"
          style="padding:6px 12px;background:#ffe100;color:#1a1a1a;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;"
        >
          07 Grand
        </button>
      </div>
      
      <div style="color:white;font-size:14px;font-weight:600;margin-top:15px;margin-bottom:5px;">
        Анимации (трек 0):
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button
          id="anim_null"
          style="padding:8px 15px;background:#4a90e2;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;"
        >
          Null (зациклено)
        </button>
        <button
          id="anim_idle"
          style="padding:8px 15px;background:#4a90e2;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;"
        >
          Idle (зациклено)
        </button>
        <button
          id="anim_idle_no_text"
          style="padding:8px 15px;background:#4a90e2;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;"
        >
          Idle No Text (зациклено)
        </button>
      </div>
      
      <div style="color:white;font-size:14px;font-weight:600;margin-top:15px;margin-bottom:5px;">
        Анимации (трек 1):
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button
          id="anim_appearance"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          Appearance
        </button>
        <button
          id="anim_start"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          Start
        </button>
        <button
          id="anim_hit"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          Hit
        </button>
        <button
          id="anim_shot"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          Shot
        </button>
        <button
          id="anim_shot_to_total"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          Shot to Total
        </button>
        <button
          id="anim_color_to_gold"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          Color to Gold
        </button>
        <button
          id="anim_jp_to_mult"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;"
        >
          JP to Mult
        </button>
        <button
          id="anim_win"
          style="padding:8px 15px;background:#ff6b35;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;"
        >
          Win
        </button>
      </div>
      
      <div style="color:white;font-size:14px;font-weight:600;margin-top:15px;margin-bottom:5px;">
        Track анимации (трек 2):
      </div>
      <div style="display:flex;gap:8px;">
        <button
          id="anim_track_jp_mult"
          style="padding:8px 15px;background:#4ecdc4;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;"
        >
          Track JP Mult
        </button>
        <button
          id="anim_track_no_jp_mult"
          style="padding:8px 15px;background:#4ecdc4;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;"
        >
          Track No JP Mult
        </button>
      </div>
      
      <div style="color:white;font-size:12px;margin-top:15px;padding:10px;background:#333;border-radius:5px;">
        <div>Текущий скин: <span id="currentSkin" style="color:#4ecdc4;">00_gold</span></div>
        <div style="margin-top:5px;">Текущая анимация: <span id="currentAnim" style="color:#4ecdc4;">idle</span></div>
      </div>
      
      <div style="color:white;font-size:14px;font-weight:600;margin-top:15px;margin-bottom:5px;">
        Второй экземпляр (сюжет):
      </div>
      <div style="display:flex;gap:8px;">
        <button
          id="action_btn"
          style="padding:10px 20px;background:#9b59b6;color:white;border:none;border-radius:5px;cursor:pointer;font-size:14px;font-weight:600;"
        >
          Action
        </button>
      </div>
      
      <div style="color:white;font-size:14px;font-weight:600;margin-top:15px;margin-bottom:5px;">
        Партиклы:
      </div>
      <div style="display:flex;gap:8px;">
        <button
          id="particle_toggle"
          style="padding:10px 20px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer;font-size:14px;font-weight:600;"
        >
          Start Particles
        </button>
      </div>
    </div>
    
    <script>
      (async () => {
        const app = new PIXI.Application();
        await app.init({
          width: window.innerWidth,
          height: window.innerHeight,
          backgroundColor: 0x1a1a1a,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
        });
        document.body.appendChild(app.canvas);
        app.stage.sortableChildren = true;

        // Загрузка фона
        const bgTexture = await PIXI.Assets.load("./png/bg1.png");
        const bgSprite = new PIXI.Sprite(bgTexture);
        bgSprite.x = app.screen.width / 2;
        bgSprite.y = app.screen.height / 2;
        bgSprite.anchor.set(0.5);
        bgSprite.zIndex = 0;
        app.stage.addChild(bgSprite);

        // Полифилл для BLEND_MODES (совместимость с PIXI v8)
        // В PIXI v8 константы могут быть в разных местах, проверяем все варианты
        if (!PIXI.BLEND_MODES) {
          // Пробуем найти в разных местах
          const blendModes = 
            PIXI.BlendModes || 
            PIXI.constants?.BLEND_MODES ||
            PIXI.utils?.BLEND_MODES ||
            {};
          
          // Если не нашли, создаем полифилл
          if (Object.keys(blendModes).length === 0) {
            PIXI.BLEND_MODES = {
              NORMAL: 0,
              ADD: 1,
              MULTIPLY: 2,
              SCREEN: 3,
              OVERLAY: 4,
              DARKEN: 5,
              LIGHTEN: 6,
              COLOR_DODGE: 7,
              COLOR_BURN: 8,
              HARD_LIGHT: 9,
              SOFT_LIGHT: 10,
              DIFFERENCE: 11,
              EXCLUSION: 12,
              HUE: 13,
              SATURATION: 14,
              COLOR: 15,
              LUMINOSITY: 16
            };
          } else {
            // Используем найденные константы
            PIXI.BLEND_MODES = blendModes;
          }
        }
        
        // Также пробуем установить через разные пути для совместимости
        if (PIXI.BLEND_MODES && !PIXI.BlendModes) {
          PIXI.BlendModes = PIXI.BLEND_MODES;
        }

        // Загрузка Spine ресурсов и партиклов
        await PIXI.Assets.load([
          { alias: "eggsSkeleton", src: "./spine/eggs/skeleton.json" },
          { alias: "eggsAtlas", src: "./spine/eggs/skeleton.atlas" },
          { alias: "boomSkeleton", src: "./spine/boom/skeleton.json" },
          { alias: "boomAtlas", src: "./spine/boom/skeleton.atlas" },
          { alias: "shotEmitter", src: "./particles/shot_emitter.json" },
          { alias: "particleGold", src: "./particles/shot_emitter_p/gold.png" },
        ]);

        // Создание первого Spine объекта
        const eggs = spine.Spine.from({
          skeleton: "eggsSkeleton",
          atlas: "eggsAtlas",
          scale: 1,
        });

        // Устанавливаем физику, если нужно
        if (!eggs.skeleton.physics) {
          eggs.skeleton.physics = {
            update: () => {},
            updateGlobal: () => {},
          };
        }

        // Центрируем на экране (смещаем влево для первого)
        eggs.x = app.screen.width / 2 - 200;
        eggs.y = app.screen.height / 2;
        eggs.zIndex = 1;

        app.stage.addChild(eggs);

        // Создание второго Spine объекта (для сюжета)
        const eggs2 = spine.Spine.from({
          skeleton: "eggsSkeleton",
          atlas: "eggsAtlas",
          scale: 1,
        });

        // Устанавливаем физику для второго экземпляра
        if (!eggs2.skeleton.physics) {
          eggs2.skeleton.physics = {
            update: () => {},
            updateGlobal: () => {},
          };
        }

        // Центрируем на экране (смещаем вправо для второго)
        eggs2.x = app.screen.width / 2 + 200;
        eggs2.y = app.screen.height / 2;
        eggs2.zIndex = 1;

        app.stage.addChild(eggs2);

        // Устанавливаем начальную анимацию null для второго экземпляра
        eggs2.state.setAnimation(0, "00_null", true);

        // Кастомный эмиттер частиц (без зависимости от pixi-particles)
        class CustomParticleEmitter {
          constructor(container, texture, config = {}) {
            this.container = container;
            this.texture = texture;
            this.particles = [];
            
            // Конфигурация из shot_emitter.json
            this.config = {
              frequency: config.frequency || 0.003,
              lifetime: { 
                min: config.lifetime?.min || 0.2, 
                max: config.lifetime?.max || 0.2 
              },
              scale: { 
                start: config.scale?.start || 0.6, 
                end: config.scale?.end || 0.2 
              },
              speed: { 
                start: config.speed?.start || 0, 
                end: config.speed?.end || 0 
              },
              rotationSpeed: { 
                min: config.rotationSpeed?.min || 0, 
                max: config.rotationSpeed?.max || 0 
              },
              alpha: { 
                start: config.alpha?.start || 1, 
                end: config.alpha?.end || 1 
              },
              maxParticles: config.maxParticles || 2000,
              ...config
            };
            
            this.x = config.pos?.x || 0;
            this.y = config.pos?.y || 0;
            this.emit = false;
            this.emissionTimer = 0;
          }
          
          createParticle() {
            // Переиспользуем неактивную частицу или создаем новую
            let particle = this.particles.find(p => !p.active);
            
            if (!particle) {
              const sprite = new PIXI.Sprite(this.texture);
              sprite.anchor.set(0.5);
              
              // В PIXI v8 blendMode можно использовать как строку "add"
              // Согласно документации: https://pixijs.download/v8.14.3/docs/filters.BLEND_MODES.html
              sprite.blendMode = "add"; // Используем строковое значение
              
              this.container.addChild(sprite);
              
              // Устанавливаем blendMode еще раз после добавления (может сброситься)
              sprite.blendMode = "add";
              
              particle = { sprite, active: false };
              this.particles.push(particle);
            } else {
              // Убеждаемся, что blendMode установлен для переиспользуемой частицы
              particle.sprite.blendMode = "add";
            }
            
            // Инициализация частицы
            particle.active = true;
            particle.x = this.x;
            particle.y = this.y;
            
            // Скорость (из конфига)
            const speed = this.config.speed.start + Math.random() * (this.config.speed.end - this.config.speed.start);
            const angle = Math.random() * Math.PI * 2; // Случайный угол
            particle.vx = Math.cos(angle) * speed;
            particle.vy = Math.sin(angle) * speed;
            
            particle.lifetime = 0;
            particle.maxLifetime = this.config.lifetime.min + Math.random() * (this.config.lifetime.max - this.config.lifetime.min);
            particle.rotationSpeed = this.config.rotationSpeed.min + Math.random() * (this.config.rotationSpeed.max - this.config.rotationSpeed.min);
            
            particle.scaleStart = this.config.scale.start;
            particle.scaleEnd = this.config.scale.end;
            particle.alphaStart = this.config.alpha.start;
            particle.alphaEnd = this.config.alpha.end;
            
            particle.sprite.x = particle.x;
            particle.sprite.y = particle.y;
            particle.sprite.rotation = Math.random() * Math.PI * 2;
            particle.sprite.scale.set(particle.scaleStart);
            particle.sprite.alpha = particle.alphaStart;
            particle.sprite.visible = true;
            
            return particle;
          }
          
          updateParticle(particle, deltaTime) {
            // Физика
            particle.x += particle.vx * deltaTime;
            particle.y += particle.vy * deltaTime;
            
            // Время жизни
            particle.lifetime += deltaTime;
            const lifeProgress = particle.lifetime / particle.maxLifetime;
            
            if (lifeProgress >= 1) {
              particle.active = false;
              particle.sprite.visible = false;
              return;
            }
            
            // Обновление спрайта
            particle.sprite.x = particle.x;
            particle.sprite.y = particle.y;
            particle.sprite.rotation += particle.rotationSpeed * deltaTime;
            
            // Интерполяция масштаба и прозрачности
            const scale = particle.scaleStart + (particle.scaleEnd - particle.scaleStart) * lifeProgress;
            const alpha = particle.alphaStart + (particle.alphaEnd - particle.alphaStart) * lifeProgress;
            particle.sprite.scale.set(scale);
            particle.sprite.alpha = alpha;
            
            // Убеждаемся, что blendMode установлен (на случай если он сбросился)
            // В PIXI v8 используем строковое значение "add"
            particle.sprite.blendMode = "add";
          }
          
          update(deltaTime) {
            // Эмиссия новых частиц
            if (this.emit) {
              this.emissionTimer += deltaTime;
              const activeCount = this.particles.filter(p => p.active).length;
              
              if (this.emissionTimer >= this.config.frequency && activeCount < this.config.maxParticles) {
                this.createParticle();
                this.emissionTimer = 0;
              }
            }
            
            // Обновление всех активных частиц
            for (const particle of this.particles) {
              if (particle.active) {
                this.updateParticle(particle, deltaTime);
              }
            }
          }
          
          setPosition(x, y) {
            this.x = x;
            this.y = y;
          }
          
          clear() {
            for (const particle of this.particles) {
              particle.active = false;
              if (particle.sprite) {
                particle.sprite.visible = false;
              }
            }
          }
          
          destroy() {
            this.clear();
            for (const particle of this.particles) {
              if (particle.sprite) {
                this.container.removeChild(particle.sprite);
                particle.sprite.destroy();
              }
            }
            this.particles = [];
          }
        }

        // Создание партикл системы
        let particleEmitter = null;
        let particleContainer = null;
        let point1 = null;
        let point2 = null;
        let isFlying = false;
        let flyProgress = 0;
        const flyDuration = 0.5; // Длительность перелета в секундах (в 4 раза быстрее: 2.0 / 4 = 0.5)
        let boomSpine = null; // Spine объект для boom эффекта
        
        try {
          // Создаем контейнер для партиклов
          // В PIXI v8 blendMode можно использовать как строку "add"
          // Согласно документации: https://pixijs.download/v8.14.3/docs/filters.BLEND_MODES.html
          particleContainer = new PIXI.Container();
          particleContainer.zIndex = 2; // Поверх яиц
          // Пробуем установить blendMode на контейнер тоже (может не работать, но попробуем)
          particleContainer.blendMode = "add";
          app.stage.addChild(particleContainer);

          // Получаем конфиг эмитера и текстуру
          const emitterConfig = PIXI.Assets.get("shotEmitter");
          const particleTexture = PIXI.Assets.get("particleGold");

          // Создаем кастомный эмитер
          particleEmitter = new CustomParticleEmitter(
            particleContainer,
            particleTexture,
            emitterConfig
          );
          
          // Создаем две точки управления для эмиттера
          const createControlPoint = (x, y, color, label) => {
            const point = new PIXI.Graphics();
            point.beginFill(color);
            point.drawCircle(0, 0, 10);
            point.endFill();
            point.x = x;
            point.y = y;
            point.zIndex = 1000; // Поверх всего
            point.eventMode = 'static';
            point.cursor = 'pointer';
            point.hitArea = new PIXI.Circle(0, 0, 15);
            
            // Добавляем текст с меткой
            const text = new PIXI.Text(label, {
              fontSize: 12,
              fill: color,
              fontWeight: 'bold'
            });
            text.anchor.set(0.5);
            text.y = -20;
            point.addChild(text);
            
            app.stage.addChild(point);
            return point;
          };
          
          // Точка 1 (начальная позиция)
          point1 = createControlPoint(
            app.screen.width / 2 - 200,
            app.screen.height / 2,
            0x00ff00,
            "Point 1"
          );
          
          // Точка 2 (конечная позиция)
          point2 = createControlPoint(
            app.screen.width / 2 + 200,
            app.screen.height / 2,
            0xff0000,
            "Point 2"
          );
          
          // Перетаскивание точек
          let draggedPoint = null;
          let dragOffset = { x: 0, y: 0 };
          
          const startDrag = (point, event) => {
            draggedPoint = point;
            const globalPos = event.global;
            dragOffset.x = globalPos.x - point.x;
            dragOffset.y = globalPos.y - point.y;
          };
          
          const onDrag = (event) => {
            if (draggedPoint) {
              const globalPos = event.global;
              draggedPoint.x = globalPos.x - dragOffset.x;
              draggedPoint.y = globalPos.y - dragOffset.y;
            }
          };
          
          const stopDrag = () => {
            draggedPoint = null;
          };
          
          point1.on('pointerdown', (e) => startDrag(point1, e));
          point2.on('pointerdown', (e) => startDrag(point2, e));
          
          app.stage.on('pointermove', onDrag);
          app.stage.on('pointerup', stopDrag);
          app.stage.on('pointerupoutside', stopDrag);
          app.stage.eventMode = 'static';
          app.stage.hitArea = app.screen;
          
          // Позиционируем эмитер в точке 1
          particleEmitter.setPosition(point1.x, point1.y);
          
          // Создаем Spine объект для boom эффекта
          boomSpine = spine.Spine.from({
            skeleton: "boomSkeleton",
            atlas: "boomAtlas",
            scale: 1,
          });
          
          // Устанавливаем физику для boom
          if (!boomSpine.skeleton.physics) {
            boomSpine.skeleton.physics = {
              update: () => {},
              updateGlobal: () => {},
            };
          }
          
          boomSpine.zIndex = 3; // Поверх партиклов
          boomSpine.visible = false; // Скрыт по умолчанию
          app.stage.addChild(boomSpine);
          
          console.log("✅ Кастомная партикл система создана");
          console.log("   Точки управления созданы");
          console.log("   Boom Spine создан");
        } catch (error) {
          console.error("❌ Ошибка при создании партикл системы:", error);
        }

        // Инициализация дебаггера позиций (только для первого экземпляра)
        const debugEditor = new DebugPositionEditor(app, eggs, bgSprite);

        // Треки для анимаций - используем несколько треков для лучшего миксинга
        const TRACK_IDLE = 0; // Базовый трек для null (всегда включен)
        const TRACK_MAIN = 1; // Трек для разовых анимаций (поверх null)
        const TRACK_TRACK = 2; // Трек для track анимаций (поверх всего)
        
        // Базовая анимация idle на треке 0 (зациклена, всегда включена)
        eggs.state.setAnimation(TRACK_IDLE, "00_idle", true);

        // Текущий скин
        let currentSkin = "00_gold";
        const updateSkin = (skinName) => {
          const skin = eggs.skeleton.data.findSkin(skinName);
          if (skin) {
            eggs.skeleton.setSkin(skin);
            eggs.skeleton.setSlotsToSetupPose();
            if (eggs.skeleton.physics) {
              eggs.skeleton.updateWorldTransform(eggs.skeleton.physics.update);
            }
            currentSkin = skinName;
            document.getElementById("currentSkin").textContent = skinName;
            console.log(`✅ Скин '${skinName}' установлен`);
          } else {
            console.warn(`⚠️ Скин '${skinName}' не найден`);
          }
        };

        // Функция для запуска анимации на треке 1 (поверх null)
        const playAnimation = (animName, loop = false) => {
          // Если это idle, idle_no_text или null, играем на треке 0
          if (animName === "idle" || animName === "idle_no_text" || animName === "null") {
            const fullAnimName = animName === "idle" ? "00_idle" : 
                                 animName === "idle_no_text" ? "00_idle_no_text" : "00_null";
            eggs.state.setAnimation(TRACK_IDLE, fullAnimName, true);
            document.getElementById("currentAnim").textContent = animName;
            return;
          }
          
          // Маппинг старых названий на новые с индексами
          const animNameMap = {
            "appearance": "02_appearance",
            "start": "02_start",
            "hit": "02_hit",
            "shot": "02_shot",
            "shot_to_total": "02_shot_to_total",
            "color_to_gold": "02_color_to_gold",
            "jp_to_mult": "02_jp_to_mult",
            "win": "02_win"
          };
          
          const fullAnimName = animNameMap[animName] || animName;
          
          // Для остальных анимаций используем трек 1 (поверх null)
          const entry = eggs.state.setAnimation(TRACK_MAIN, fullAnimName, loop);
          if (entry) {
            // Для appearance используем нулевой микс (мгновенное появление)
            // Для остальных анимаций устанавливаем быстрый переход
            if (animName === "appearance") {
              entry.mixDuration = 0; // Мгновенное появление для appearance
            } else {
              entry.mixDuration = 0.1; // Быстрый переход для остальных
            }
            document.getElementById("currentAnim").textContent = animName;
            console.log(`✅ Анимация '${fullAnimName}' запущена на треке ${TRACK_MAIN}`);
          } else {
            console.warn(`⚠️ Анимация '${fullAnimName}' не найдена`);
          }
        };

        // Функция для запуска track анимации на треке 2 (переключение между track анимациями)
        const playTrackAnimation = (animName, loop = false) => {
          // Маппинг старых названий на новые с индексами
          const trackAnimNameMap = {
            "track_jp_mult": "01_track_jp_mult",
            "track_no_jp_mult": "01_track_no_jp_mult"
          };
          
          const fullAnimName = trackAnimNameMap[animName] || animName;
          
          // Просто переключаем анимацию с миксингом, как на треке 1
          const entry = eggs.state.setAnimation(TRACK_TRACK, fullAnimName, loop);
          if (entry) {
            // Устанавливаем быстрый переход при переключении (в 3 раза быстрее)
            entry.mixDuration = 0.2; // Быстрое переключение track анимации
            console.log(`✅ Анимация '${fullAnimName}' запущена на треке ${TRACK_TRACK}`);
          } else {
            console.warn(`⚠️ Анимация '${fullAnimName}' не найдена`);
          }
        };

        // Обработчики для скинов
        // Устанавливаем начальный скин gold
        updateSkin("00_gold");
        
        document.getElementById("skin_00_gold").onclick = () => updateSkin("00_gold");
        document.getElementById("skin_01_blue").onclick = () => updateSkin("01_blue");
        document.getElementById("skin_02_red").onclick = () => updateSkin("02_red");
        document.getElementById("skin_03_purple").onclick = () => updateSkin("03_purple");
        document.getElementById("skin_04_mini").onclick = () => updateSkin("04_mini");
        document.getElementById("skin_05_midi").onclick = () => updateSkin("05_midi");
        document.getElementById("skin_06_major").onclick = () => updateSkin("06_major");
        document.getElementById("skin_07_grand").onclick = () => updateSkin("07_grand");

        // Обработчики для анимаций (трек 0)
        document.getElementById("anim_null").onclick = () => playAnimation("null", true);
        document.getElementById("anim_idle").onclick = () => playAnimation("idle", true);
        document.getElementById("anim_idle_no_text").onclick = () => playAnimation("idle_no_text", true);
        document.getElementById("anim_appearance").onclick = () => playAnimation("appearance", false);
        document.getElementById("anim_start").onclick = () => playAnimation("start", false);
        document.getElementById("anim_hit").onclick = () => playAnimation("hit", false);
        document.getElementById("anim_shot").onclick = () => playAnimation("shot", false);
        document.getElementById("anim_shot_to_total").onclick = () => playAnimation("shot_to_total", false);
        document.getElementById("anim_color_to_gold").onclick = () => playAnimation("color_to_gold", false);
        document.getElementById("anim_jp_to_mult").onclick = () => playAnimation("jp_to_mult", false);
        document.getElementById("anim_win").onclick = () => playAnimation("win", false);

        // Обработчик для track анимации (трек 2)
        document.getElementById("anim_track_jp_mult").onclick = () => playTrackAnimation("track_jp_mult", true);
        document.getElementById("anim_track_no_jp_mult").onclick = () => playTrackAnimation("track_no_jp_mult", true);

        // Слушатель для завершения анимаций
        eggs.state.addListener({
          complete: (entry) => {
            // После завершения разовых анимаций на треке 1 просто очищаем трек
            // null продолжает играть на треке 0
            if (entry.trackIndex === TRACK_MAIN) {
              console.log(`✅ Анимация '${entry.animation.name}' завершена`);
              // Быстро очищаем трек - idle на треке 0 продолжит играть (в 3 раза быстрее)
              eggs.state.setEmptyAnimation(TRACK_MAIN, 0.1);
              document.getElementById("currentAnim").textContent = "idle";
            }
          },
          event: (entry, event) => {
            console.log(`📢 Событие: ${event.data.name}`);
          }
        });

        // Функция для установки скина второго экземпляра
        const updateSkin2 = (skinName) => {
          const skin = eggs2.skeleton.data.findSkin(skinName);
          if (skin) {
            eggs2.skeleton.setSkin(skin);
            eggs2.skeleton.setSlotsToSetupPose();
            if (eggs2.skeleton.physics) {
              eggs2.skeleton.updateWorldTransform(eggs2.skeleton.physics.update);
            }
            console.log(`✅ Скин '${skinName}' установлен для второго экземпляра`);
          } else {
            console.warn(`⚠️ Скин '${skinName}' не найден`);
          }
        };

        // Функция для проигрывания анимации на втором экземпляре
        const playAnimation2 = (animName, loop = false, track = 1) => {
          let fullAnimName = animName;
          
          // Маппинг названий на новые с индексами
          const animNameMap = {
            "idle": "00_idle",
            "idle_no_text": "00_idle_no_text",
            "null": "00_null",
            "appearance": "02_appearance",
            "color_to_gold": "02_color_to_gold",
            "win": "02_win",
            "shot_to_total": "02_shot_to_total"
          };
          
          fullAnimName = animNameMap[animName] || animName;
          
          // Если это idle или idle_no_text, играем на треке 0
          if (animName === "idle" || animName === "idle_no_text" || animName === "null") {
            eggs2.state.setAnimation(0, fullAnimName, loop);
            return;
          }
          
          // Для остальных анимаций используем указанный трек
          const entry = eggs2.state.setAnimation(track, fullAnimName, loop);
          if (entry) {
            if (animName === "appearance") {
              entry.mixDuration = 0; // Мгновенное появление
            } else {
              entry.mixDuration = 0.2; // Переход
            }
            console.log(`✅ Анимация '${fullAnimName}' запущена на треке ${track} для второго экземпляра`);
          } else {
            console.warn(`⚠️ Анимация '${fullAnimName}' не найдена`);
          }
        };

        // Переменная для отслеживания состояния сюжета
        let storyInProgress = false;
        let storyTimeout = null;

        // Функция для проигрывания сюжета
        const playStory = () => {
          if (storyInProgress) {
            console.log("⚠️ Сюжет уже проигрывается");
            return;
          }
          
          storyInProgress = true;
          console.log("🎬 Начало сюжета");
          
          // Очищаем все треки перед началом
          eggs2.state.clearTracks();
          
          // Часть 1: Скин 01_blue
          updateSkin2("01_blue");
          
          // Устанавливаем начальное состояние - idle на треке 0
          eggs2.state.setAnimation(0, "00_idle", true);
          
          // Шаг 1: Appearance (мгновенно)
          const appearanceEntry = eggs2.state.setAnimation(1, "02_appearance", false);
          if (appearanceEntry) {
            appearanceEntry.mixDuration = 0;
            
            // После завершения appearance переходим к idle
            appearanceEntry.listener = {
              complete: () => {
                console.log("✅ Appearance завершена, переход к idle");
                playAnimation2("idle", true, 0);
                
                // Через 1 секунду переходим к color_to_gold
                storyTimeout = setTimeout(() => {
                  console.log("✅ Idle проиграна 1 секунду, переход к color_to_gold");
                  const colorToGoldEntry = eggs2.state.setAnimation(1, "02_color_to_gold", false);
                  if (colorToGoldEntry) {
                    colorToGoldEntry.mixDuration = 0.2;
                    
                    // После завершения color_to_gold начинаем часть 2
                    colorToGoldEntry.listener = {
                      complete: () => {
                        console.log("✅ Color to gold завершена, начало части 2");
                        
                        // Часть 2: Смена скина на 00_gold
                        updateSkin2("00_gold");
                        
                        // Очищаем трек 1 и устанавливаем idle на треке 0
                        eggs2.state.setEmptyAnimation(1, 0.2);
                        playAnimation2("idle", true, 0);
                        
                        // Через 1 секунду переходим к win
                        storyTimeout = setTimeout(() => {
                          console.log("✅ Idle проиграна 1 секунду, переход к win");
                          const winEntry = eggs2.state.setAnimation(1, "02_win", false);
                          if (winEntry) {
                            winEntry.mixDuration = 0.2;
                            
                            // После завершения win переходим к shot_to_total
                            winEntry.listener = {
                              complete: () => {
                                console.log("✅ Win завершена, переход к shot_to_total");
                                const shotToTotalEntry = eggs2.state.setAnimation(1, "02_shot_to_total", false);
                                if (shotToTotalEntry) {
                                  shotToTotalEntry.mixDuration = 0.2;
                                  
                                  // После завершения shot_to_total переходим к idle_no_text (финал)
                                  shotToTotalEntry.listener = {
                                    complete: () => {
                                      console.log("✅ Shot to total завершена, переход к idle_no_text (финал)");
                                      playAnimation2("idle_no_text", true, 0);
                                      eggs2.state.setEmptyAnimation(1, 0.2);
                                      storyInProgress = false;
                                      console.log("🎬 Сюжет завершен");
                                    }
                                  };
                                }
                              }
                            };
                          }
                        }, 1000);
                      }
                    };
                  }
                }, 1000);
              }
            };
          }
        };

        // Обработчик кнопки Action
        document.getElementById("action_btn").onclick = () => {
          // Останавливаем предыдущий сюжет, если он был запущен
          if (storyTimeout) {
            clearTimeout(storyTimeout);
            storyTimeout = null;
          }
          eggs2.state.clearTracks();
          storyInProgress = false;
          
          // Запускаем новый сюжет
          playStory();
        };

        // Обработчик кнопки партиклов
        let particlesEnabled = false;
        document.getElementById("particle_toggle").onclick = () => {
          if (!particleEmitter) {
            console.warn("⚠️ Партикл эмитер не создан");
            return;
          }
          
          if (particlesEnabled) {
            // Выключаем партиклы
            particlesEnabled = false;
            particleEmitter.emit = false;
            particleEmitter.clear();
            isFlying = false;
            flyProgress = 0;
            
            const btn = document.getElementById("particle_toggle");
            btn.textContent = "Start Particles";
            btn.style.background = "#e74c3c";
            console.log("✅ Партиклы выключены");
          } else {
            // Включаем партиклы и сразу начинаем перелет
            particlesEnabled = true;
            
            // Позиционируем эмитер в точке 1
            if (point1) {
              particleEmitter.setPosition(point1.x, point1.y);
            }
            
            // Включаем эмиссию и сразу начинаем перелет
            particleEmitter.emit = true;
            isFlying = true;
            flyProgress = 0;
            
            const btn = document.getElementById("particle_toggle");
            btn.textContent = "Stop Particles";
            btn.style.background = "#27ae60";
            console.log("✅ Партиклы включены, начинается перелет");
          }
        };

        // Обновление в ticker
        app.ticker.add(() => {
          if (eggs && eggs.skeleton && eggs.skeleton.physics) {
            eggs.skeleton.updateWorldTransform(eggs.skeleton.physics.update);
          }
          if (eggs2 && eggs2.skeleton && eggs2.skeleton.physics) {
            eggs2.skeleton.updateWorldTransform(eggs2.skeleton.physics.update);
          }
          if (boomSpine && boomSpine.skeleton && boomSpine.skeleton.physics) {
            boomSpine.skeleton.updateWorldTransform(boomSpine.skeleton.physics.update);
          }
          
          // Обновляем партикл систему
          if (particleEmitter && point1 && point2) {
            // Обновляем эмитер (deltaTime в секундах)
            const deltaTime = app.ticker.deltaMS / 1000;
            particleEmitter.update(deltaTime);
            
            // Логика перелета между точками
            if (isFlying) {
              flyProgress += deltaTime;
              const t = Math.min(flyProgress / flyDuration, 1); // Нормализованный прогресс 0-1
              
              // Базовые координаты (линейная интерполяция)
              const baseX = point1.x + (point2.x - point1.x) * t;
              const baseY = point1.y + (point2.y - point1.y) * t;
              
              // Вычисляем вектор направления от точки 1 к точке 2
              const dx = point2.x - point1.x;
              const dy = point2.y - point1.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              // Нормализуем вектор направления
              const dirX = dx / distance;
              const dirY = dy / distance;
              
              // Перпендикулярный вектор (повернутый на 90 градусов)
              const perpX = -dirY; // Перпендикуляр по X
              const perpY = dirX;  // Перпендикуляр по Y
              
              // Высота дуги в пикселях (можно настроить)
              const arcHeight = 100;
              
              // Параболическая функция для высоты дуги: -4h * t * (t - 1)
              // Максимум в середине (t = 0.5), значение 0 на краях (t = 0 и t = 1)
              const arcProgress = -4 * arcHeight * t * (t - 1);
              
              // Отклоняемся по перпендикуляру на высоту дуги
              const currentX = baseX + perpX * arcProgress;
              const currentY = baseY + perpY * arcProgress;
              
              particleEmitter.setPosition(currentX, currentY);
              
              // Если перелет завершен
              if (t >= 1) {
                isFlying = false;
                flyProgress = 0;
                // Останавливаем эмиссию по достижению конечной точки
                particleEmitter.emit = false;
                
                // Проигрываем boom анимацию в точке приземления
                if (boomSpine && point2) {
                  boomSpine.x = point2.x;
                  boomSpine.y = point2.y;
                  boomSpine.visible = true;
                  
                  // Получаем анимацию из boom skeleton (название "animation" согласно skeleton.json)
                  const animName = "animation"; // Название анимации из skeleton.json
                  
                  boomSpine.state.setAnimation(0, animName, false);
                  
                  // Очищаем предыдущие слушатели и добавляем новый
                  boomSpine.state.clearListeners();
                  boomSpine.state.addListener({
                    complete: (entry) => {
                      if (entry.trackIndex === 0 && entry.animation.name === animName) {
                        boomSpine.visible = false;
                        console.log("✅ Boom анимация завершена");
                      }
                    }
                  });
                  
                  console.log(`✅ Boom анимация '${animName}' запущена в точке приземления`);
                }
                
                console.log("✅ Эмитер перелетел в точку 2 и остановлен");
              }
            } else {
              // Если не летит, эмитер следует за точкой 1
              particleEmitter.setPosition(point1.x, point1.y);
            }
          }
        });

        // Обработчик изменения размера окна
        window.addEventListener("resize", () => {
          setTimeout(() => {
            eggs.x = app.screen.width / 2 - 200;
            eggs.y = app.screen.height / 2;
            eggs2.x = app.screen.width / 2 + 200;
            eggs2.y = app.screen.height / 2;
            bgSprite.x = app.screen.width / 2;
            bgSprite.y = app.screen.height / 2;
          }, 100);
        });

        console.log("✅ Eggs Test Stand загружен");
      })()
        .catch((err) => {
          console.error(err);
          document.body.innerHTML =
            '<div style="color:#fff;font-family:monospace;padding:24px;">Ошибка: ' +
            err.message +
            "</div>";
        });
    </script>
  </body>
</html>
