<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Zeus 3 Pots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .game-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .game-stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background-image: url("./png/1920х1080.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* Контейнер под будущий canvas / Pixi приложение */
    #game-root {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* пока только фон, позже изменим */
    }

    .debug-label {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 12px;
      border-radius: 4px;
    }

    @media (max-width: 1920px), (max-height: 1080px) {
      .game-stage {
        transform-origin: center center;
        transform: scale(calc(min(100vw / 1920, 100vh / 1080)));
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-stage">
      <div id="game-root"></div>
      <div class="debug-label">Zeus 3 Pots · 1920×1080 background</div>
    </div>
  </div>

  <!-- PIXI.js v8 (глобальный PIXI) -->
  <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
  <!-- Основная логика слота Zeus (ES-модуль) -->
  <script type="module" src="./zeusMain.js"></script>
</body>
</html>
